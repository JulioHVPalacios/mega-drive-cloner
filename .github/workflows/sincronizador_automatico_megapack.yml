name: 🔄 Sincronizador Automático Megapack (Auto-Update Watchdog)

on:
  schedule:
    # Se ejecuta dos veces al día de forma 100% desatendida (PC Apagada):
    # 1) 04:00 AM hora local Perú/Colombia/Ecuador (09:00 UTC)
    # 2) 12:00 PM mediodía hora local (17:00 UTC)
    - cron: '0 9,17 * * *'
  workflow_dispatch:
    inputs:
      destination_account:
        description: 'Cuenta destino para la sincronización'
        required: true
        default: 'midrive2 (Vexor 5TB)'
        type: choice
        options:
          - 'midrive2 (Vexor 5TB)'
          - 'midrive (Julio)'
      sync_mode:
        description: 'Modo de Sincronización (100% Seguro y Blindado)'
        required: true
        default: 'Aditivo Seguro (Solo copiar lo nuevo, CERO BORRADOS)'
        type: choice
        options:
          - 'Aditivo Seguro (Solo copiar lo nuevo, CERO BORRADOS)'

jobs:
  sincronizar_megapack:
    name: 🛰️ Monitoreo y Auto-Actualización Desatendida (PC Apagada)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF
          echo "✅ Rclone configurado y listo."

      - name: 🔍 Detectar Cambios en el Megapack Compartido
        id: check_changes
        run: |
          SRC="gdrive:"
          if [ "${{ inputs.destination_account }}" = "midrive (Julio)" ]; then
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          fi

          echo "Buscando si el dueño agregó cursos o modificó archivos..."
          mkdir -p /tmp/diffs
          rclone check "$SRC" "$DST" --one-way --missing-on-dst /tmp/diffs/nuevos.txt --fast-list || true
          
          if [ -s /tmp/diffs/nuevos.txt ]; then
            CANTIDAD=$(wc -l < /tmp/diffs/nuevos.txt)
            echo "⚡ ¡Se detectaron $CANTIDAD archivos/cursos nuevos en el origen!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            head -n 20 /tmp/diffs/nuevos.txt
          else
            echo "✅ El Megapack ya está 100% al día. No hay archivos nuevos por descargar."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Sincronizar Automáticamente lo Nuevo
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          SRC="gdrive:"
          if [ "${{ inputs.destination_account }}" = "midrive (Julio)" ]; then
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          fi

          echo "🛡️ Modo estrictamente aditivo: SOLO COPIAR NUEVOS ARCHIVOS (CERO BORRADOS)."
          rclone copy "$SRC" "$DST" \
            --fast-list \
            --update \
            --checksum \
            --transfers=12 \
            --checkers=24 \
            --buffer-size=64M \
            --use-mmap \
            --drive-chunk-size=128M \
            --drive-server-side-across-configs=true \
            --retries=10 \
            --low-level-retries=20 \
            -v -P --stats 15s

          echo "🎉 ¡Sincronización completada exitosamente!"

      - name: 📊 Auditoría y Verificación de Cierre
        run: |
          if [ "${{ inputs.destination_account }}" = "midrive (Julio)" ]; then
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          fi
          echo "=========================================================="
          echo "📊 TAMAÑO ACTUALIZADO DE TU MEGAPACK:"
          echo "=========================================================="
          rclone size "$DST" --fast-list
          echo "=========================================================="

      - name: 🔔 Notificación de Novedades a Telegram (Watchdog 24/7)
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            CANTIDAD=$(wc -l < /tmp/diffs/nuevos.txt 2>/dev/null || echo "varios")
            MSG="⚡ <b>¡NOVEDADES EN EL MEGAPACK!</b>%0A%0ASe detectaron <b>$CANTIDAD archivos/cursos nuevos</b> agregados por el dueño.%0A🎉 Ya han sido inyectados automáticamente en tu Google Drive en su carpeta correspondiente.%0A%0A🛡️ <i>Tu sistema sigue 100% al día con tu PC apagada.</i>"
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d "chat_id=$TG_CHAT_ID" \
              -d "parse_mode=HTML" \
              -d "text=$MSG" > /dev/null || true
            echo "✅ Alerta enviada a Telegram."
          fi
