name: 🔄 Sincronizador Automático Megapack (Auto-Update Watchdog)

on:
  schedule:
    # Se ejecuta dos veces al día de forma 100% desatendida (PC Apagada):
    # 1) 04:00 AM hora local Perú/Colombia/Ecuador (09:00 UTC)
    # 2) 12:00 PM mediodía hora local (17:00 UTC)
    - cron: '0 9,17 * * *'
  workflow_dispatch:
    inputs:
      destination_account:
        description: 'Cuenta destino para la sincronización'
        required: true
        default: 'midrive (Julio)'
        type: choice
        options:
          - 'midrive (Julio)'
          - 'midrive2 (Vexor 5TB)'
      sync_mode:
        description: 'Modo de Sincronización (100% Seguro y Blindado)'
        required: true
        default: 'Aditivo Seguro (Solo copiar lo nuevo, CERO BORRADOS)'
        type: choice
        options:
          - 'Aditivo Seguro (Solo copiar lo nuevo, CERO BORRADOS)'

jobs:
  sincronizar_megapack:
    name: 🛰️ Monitoreo y Auto-Actualización Desatendida (PC Apagada)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF
          echo "✅ Rclone configurado y listo."

      - name: 🔍 Detectar Cambios en el Megapack Compartido
        id: check_changes
        run: |
          SRC="gdrive:"
          if [ "${{ inputs.destination_account }}" = "midrive2 (Vexor 5TB)" ]; then
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          fi

          echo "Buscando si el dueño agregó cursos o modificó archivos..."
          mkdir -p /tmp/diffs
          rclone check "$SRC" "$DST" --one-way --missing-on-dst /tmp/diffs/nuevos.txt --fast-list || true
          
          if [ -s /tmp/diffs/nuevos.txt ]; then
            CANTIDAD=$(wc -l < /tmp/diffs/nuevos.txt)
            echo "⚡ ¡Se detectaron $CANTIDAD archivos/cursos nuevos en el origen!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            head -n 20 /tmp/diffs/nuevos.txt
          else
            echo "✅ El Megapack ya está 100% al día. No hay archivos nuevos por descargar."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Sincronizar Automáticamente lo Nuevo
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          SRC="gdrive:"
          if [ "${{ inputs.destination_account }}" = "midrive2 (Vexor 5TB)" ]; then
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          fi

          echo "🛡️ Modo estrictamente aditivo: SOLO COPIAR NUEVOS ARCHIVOS (CERO BORRADOS)."
          rclone copy "$SRC" "$DST" \
            --fast-list \
            --update \
            --checksum \
            --transfers=12 \
            --checkers=24 \
            --buffer-size=64M \
            --use-mmap \
            --drive-chunk-size=128M \
            --drive-server-side-across-configs=true \
            --retries=10 \
            --low-level-retries=20 \
            -v -P --stats 15s

          echo "🎉 ¡Sincronización completada exitosamente!"

      - name: 📊 Auditoría y Verificación de Cierre
        run: |
          if [ "${{ inputs.destination_account }}" = "midrive (Julio)" ]; then
            DST="midrive:MEGAPACK_PROGRAMACION_COMPLETO"
          else
            DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO"
          fi
          echo "=========================================================="
          echo "📊 TAMAÑO ACTUALIZADO DE TU MEGAPACK:"
          echo "=========================================================="
          rclone size "$DST" --fast-list
          echo "=========================================================="

      - name: 🔔 Notificación de Novedades a Telegram (Watchdog 24/7)
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")

          if not token or not chat_id:
              print("ℹ️ Telegram credentials not configured. Skipping.")
              exit(0)

          try:
              with open("/tmp/diffs/nuevos.txt", "r", encoding="utf-8") as f:
                  count = len(f.readlines())
          except Exception:
              count = "varios"

          html_msg = (
              "⚡ <b>¡NOVEDADES EN EL MEGAPACK!</b>\n\n"
              f"Se detectaron <b>{count} archivos/cursos nuevos</b> agregados por el dueño.\n"
              "🎉 Ya han sido inyectados automáticamente en tu Google Drive en su carpeta correspondiente.\n\n"
              "🛡️ <i>Tu sistema sigue 100% al día con tu PC apagada.</i>"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": html_msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  if resp.status == 200:
                      print("✅ Alerta enviada a Telegram con éxito.")
          except Exception as e:
              print(f"⚠️ Error al enviar Telegram: {e}")
          EOF

      - name: 🚨 Alerta de Error en Auto-Sincronizador a Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")

          if not token or not chat_id:
              exit(0)

          html_msg = (
              "🚨 <b>ALERTA EN AUTO-SINCRONIZADOR</b>\n\n"
              "El auto-sincronizador en Azure detectó una interrupción o error temporal en la API de Google.\n"
              "🛡️ <i>Tus archivos existentes están 100% seguros e intactos. El sistema reintentará en el siguiente horario automático.</i>"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": html_msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req)
          except Exception:
              pass
          EOF
