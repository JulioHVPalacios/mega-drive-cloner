name: '📦 Prueba de Fuego: Archivo Único Monolítico de 30 GB (Contenedor Multimedia)'

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_single_30gb'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  transferencia_archivo_unico_30gb:
    name: 📦 Archivo Único 30 GB (ISOs + Videos 4K + Software + Textos + Torrents)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: 🧹 Limpieza Profunda de Disco Azure (~72 GB Libres)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /imagegeneration || true
          sudo docker image prune -a -f || true
          df -h /

      - name: ⚡ Acelerador de Arranque (Instalación Binaria Directa sin APT Lag)
        run: |
          sudo apt-get install -y --no-install-recommends aria2
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Descarga, Empaquetado en Contenedor 30GB y Subida Directa a Google Drive
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          dest_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_single_30gb').strip()
          dest_remote = f"midrive:{dest_folder}"
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*75)
          print("📦 INICIANDO PRUEBA DE FUEGO: ARCHIVO ÚNICO MONOLÍTICO DE 30 GB")
          print("🎯 Destino en Google Drive: " + dest_remote + " (Julio Palacios 5TB)")
          print("📁 Contenido interno: ISOs + Videos 4K + Softwares + Textos + Torrents")
          print("="*75)

          work_dir = "/tmp/paquete_contenido"
          shutil.rmtree(work_dir, ignore_errors=True)
          os.makedirs(f"{work_dir}/isos", exist_ok=True)
          os.makedirs(f"{work_dir}/videos", exist_ok=True)
          os.makedirs(f"{work_dir}/software", exist_ok=True)
          os.makedirs(f"{work_dir}/textos", exist_ok=True)
          os.makedirs(f"{work_dir}/torrents", exist_ok=True)

          # Manifiesto de descarga con Aria2c
          download_items = [
              # ISOs (~25.98 GB)
              ("https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso", f"{work_dir}/isos/AlmaLinux-9-dvd.iso"),
              ("https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso", f"{work_dir}/isos/ubuntu-24.04-desktop.iso"),
              ("https://mirror.uepg.br/opensuse/distribution/leap/15.6/iso/openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso", f"{work_dir}/isos/openSUSE-15.6-DVD.iso"),
              # Videos 4K (~3.68 GB)
              ("https://download.blender.org/demo/movies/Blender_reel_2013.mov", f"{work_dir}/videos/Blender_4K_Reel.mov"),
              ("https://download.blender.org/demo/movies/Sintel.2010.1080p.mkv", f"{work_dir}/videos/Sintel_Master.mkv"),
              # Software (~0.24 GB)
              ("https://vscode.download.prss.microsoft.com/dbazure/download/stable/a44adf7f53e00964ab890f9f8758a334f1fc15bc/code_1.136.1-1788413865_amd64.deb", f"{work_dir}/software/vscode_amd64.deb"),
              # Textos y Docs (~0.15 GB)
              ("https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz", f"{work_dir}/textos/linux-6.12-kernel-source.tar.xz"),
              # Torrents (~0.01 GB)
              ("https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso.torrent", f"{work_dir}/torrents/ubuntu.torrent")
          ]

          input_file = "/tmp/aria2_batch.txt"
          with open(input_file, 'w', encoding='utf-8') as f:
              for url, outpath in download_items:
                  d = os.path.dirname(outpath)
                  b = os.path.basename(outpath)
                  f.write(f"{url}\n  dir={d}\n  out={b}\n")

          start_total = time.time()

          # 1. Descarga Multistream de Todos los Formatos en Paralelo
          print("⚡ [PASO 1] Descargando simultáneamente ISOs, Videos, Software, Textos y Torrents...")
          t_dl_start = time.time()
          aria2_cmd = [
              'aria2c',
              '-i', input_file,
              '-j', '8',
              '--max-connection-per-server=16',
              '--split=16',
              '--min-split-size=5M',
              '--file-allocation=none',
              '--disk-cache=128M',
              '--summary-interval=10'
          ]
          subprocess.run(aria2_cmd, check=True)
          dl_time = time.time() - t_dl_start

          # Crear archivo de texto explicativo dentro
          with open(f"{work_dir}/textos/LEEME_MANIFIESTO.txt", "w", encoding="utf-8") as f:
              f.write("PAQUETE MONOLÍTICO DE PRUEBA 30 GB\nContiene:\n- Sistemas Operativos (ISOs)\n- Videos HD/4K\n- Instaladores de Software\n- Código Fuente de Kernel\n- Archivos Torrent\n")

          # Calcular tamaño total de los contenidos
          total_content_bytes = 0
          for root, _, flist in os.walk(work_dir):
              for fn in flist:
                  fp = os.path.join(root, fn)
                  total_content_bytes += os.path.getsize(fp)

          content_gb = total_content_bytes / (1024*1024*1024)
          dl_speed = (total_content_bytes / (1024*1024)) / max(dl_time, 0.001)
          print(f"✅ Descarga completada: {content_gb:.2f} GB ({total_content_bytes:,} Bytes) en {dl_time:.1f}s ({dl_speed:.2f} MB/s)")

          # 2. Empaquetado en un Archivo Único de 30 GB (TAR sin compresión para máxima velocidad de I/O)
          single_tar_path = "/tmp/PAQUETE_MAESTRO_UNIVERSAL_30GB.tar"
          print("")
          print(f"📦 [PASO 2] Empaquetando todo en UN SOLO ARCHIVO de 30 GB ({single_tar_path})...")
          t_tar_start = time.time()
          
          # GNU tar con --remove-files para no duplicar espacio en disco
          tar_cmd = ["tar", "-cf", single_tar_path, "--remove-files", "-C", work_dir, "."]
          subprocess.run(tar_cmd, check=True)
          tar_time = time.time() - t_tar_start
          
          tar_bytes = os.path.getsize(single_tar_path)
          tar_gb = tar_bytes / (1024*1024*1024)
          tar_speed = (tar_bytes / (1024*1024)) / max(tar_time, 0.001)
          print(f"✅ Archivo único creado: {tar_gb:.2f} GB ({tar_bytes:,} Bytes) en {tar_time:.1f}s ({tar_speed:.2f} MB/s)")
          shutil.rmtree(work_dir, ignore_errors=True)

          # 3. Subida del Archivo Único de 30 GB a Google Drive con Chunks de 256MB
          print("")
          print(f"📤 [PASO 3] Inyectando el ARCHIVO ÚNICO de {tar_gb:.2f} GB a Google Drive ({dest_remote})...")
          t_up_start = time.time()
          rclone_cmd = [
              'rclone', 'copy',
              single_tar_path, dest_remote,
              '--drive-chunk-size=256M',
              '--drive-upload-cutoff=256M',
              '--buffer-size=128M',
              '--use-mmap',
              '--no-traverse',
              '--stats=10s',
              '--stats-one-line',
              '--retries=5',
              '--low-level-retries=10'
          ]
          subprocess.run(rclone_cmd, check=True)
          up_time = time.time() - t_up_start
          up_speed = (tar_bytes / (1024*1024)) / max(up_time, 0.001)
          print(f"🎉 Subida completada: {tar_gb:.2f} GB en {up_time:.1f}s ({up_speed:.2f} MB/s)")

          # Limpiar archivo local
          if os.path.exists(single_tar_path):
              os.remove(single_tar_path)
          if os.path.exists(input_file):
              os.remove(input_file)
          print("🧹 Disco de Azure liberado inmediatamente.")

          elapsed_total = time.time() - start_total
          avg_speed = (tar_bytes / (1024*1024)) / max(elapsed_total, 0.001)

          print("")
          print("#"*75)
          print("🏆 PRUEBA DE ARCHIVO ÚNICO DE 30 GB FINALIZADA EXITOSAMENTE:")
          print(f"📦 Archivo Transferido: PAQUETE_MAESTRO_UNIVERSAL_30GB.tar ({tar_gb:.2f} GB / {tar_bytes:,} Bytes)")
          print(f"⏱️ Tiempo Total de Operación: {elapsed_total / 60:.2f} minutos ({elapsed_total:.1f}s)")
          print(f"⬇️ Tiempo de Descarga de Contenidos: {dl_time:.1f}s ({dl_speed:.2f} MB/s)")
          print(f"📦 Tiempo de Empaquetado Local: {tar_time:.1f}s ({tar_speed:.2f} MB/s)")
          print(f"⬆️ Tiempo Neto de Subida a Drive: {up_time:.1f}s ({up_speed:.2f} MB/s / {up_speed * 8:.1f} Mbps)")
          print(f"🚀 Velocidad Promedio E2E: {avg_speed:.2f} MB/s")
          print("#"*75)

          # 4. Auditoría y Purga en Google Drive
          print("")
          print("🔍 [PASO 4] Realizando Auditoría Forense en Google Drive...")
          res_size = subprocess.run(['rclone', 'size', dest_remote, '--json'], stdout=subprocess.PIPE, text=True)
          subprocess.run(['rclone', 'lsl', dest_remote])
          
          audit_bytes = 0
          audit_count = 0
          try:
              s_data = json.loads(res_size.stdout)
              audit_bytes = s_data.get('bytes', 0)
              audit_count = s_data.get('count', 0)
          except Exception as e:
              print(f"⚠️ Error leyendo tamaño: {e}")

          print(f"📦 Confirmado en Drive: {audit_bytes / (1024*1024*1024):.2f} GB ({audit_count} archivo)")

          if purge:
              print("🧹 Purgando archivo de prueba para dejar espacio 100% libre...")
              subprocess.run(['rclone', 'purge', dest_remote], check=True)
              subprocess.run(['rclone', 'rmdirs', 'midrive:DESCARGAS_UNIVERSALES'])
              print("✅ Limpieza completada. Verificando espacio:")
              subprocess.run(['rclone', 'size', 'midrive:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"📦 <b>¡PRUEBA ARCHIVO ÚNICO 30 GB FINALIZADA!</b>\n\n"
              f"📁 <b>Archivo:</b> PAQUETE_MAESTRO_UNIVERSAL_30GB.tar ({tar_gb:.2f} GB)\n"
              f"📂 <b>Contenido:</b> ISOs, Videos 4K, Softwares, Textos y Torrents\n"
              f"⏱️ <b>Tiempo Total:</b> {elapsed_total / 60:.2f} min ({elapsed_total:.1f}s)\n"
              f"⬇️ <b>Descarga:</b> {dl_speed:.1f} MB/s ({dl_time:.1f}s)\n"
              f"📦 <b>Empaquetado:</b> {tar_speed:.1f} MB/s ({tar_time:.1f}s)\n"
              f"⬆️ <b>Subida Neta a Drive:</b> {up_speed:.1f} MB/s ({up_time:.1f}s)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Drive 100% limpio)' if purge else 'Conservado'}"
          )
          EOF
