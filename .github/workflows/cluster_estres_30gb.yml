name: '⚡ Clúster Dual Cut-Through Streaming (Inyección Simultánea en RAM)'

on:
  workflow_dispatch:
    inputs:
      architecture_mode:
        description: '⚡ Arquitectura de Destino'
        required: true
        default: 'balanced'
        type: choice
        options:
          - 'balanced'
          - 'midrive_only'
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  cluster_nodos:
    name: 🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - nodo: 1
            name: 'AlmaLinux 9 DVD (15.2GB Cut-Through)'
            filename: 'AlmaLinux-9-latest-x86_64-dvd.iso'
            url: 'https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso'
            fallback_urls: 'https://mirrors.ircam.fr/pub/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso https://mirror.nl.leaseweb.net/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso'
            size_bytes: 15151923200
          - nodo: 2
            name: 'Rocky Linux 9 DVD (15.2GB Cut-Through)'
            filename: 'Rocky-9-latest-x86_64-dvd.iso'
            url: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso'
            fallback_urls: 'https://rocky-linux-europe-west4.s3.nl-ams.scw.cloud/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso https://mirrors.ircam.fr/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso https://mirror.oxilion.nl/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso'
            size_bytes: 15194259456
      fail-fast: false

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: ⚡ Verificación de Recursos del Runner (16GB RAM + NVMe)
        run: |
          echo "📊 Memoria RAM disponible para streaming:"
          free -h
          echo "📊 Espacio en disco:"
          df -h /

      - name: 🛠️ Instalar Dependencias (Instalación Ultrarrápida)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends aria2 curl
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Inyección Cut-Through Streaming (Descarga y Subida Simultánea)
        env:
          NODO_ID: ${{ matrix.nodo }}
          ARCH_MODE: ${{ inputs.architecture_mode }}
          FILENAME: ${{ matrix.filename }}
          PRIMARY_URL: ${{ matrix.url }}
          FALLBACK_URLS: ${{ matrix.fallback_urls }}
          SIZE_BYTES: ${{ matrix.size_bytes }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          nodo_id = int(os.environ.get('NODO_ID', '1'))
          arch_mode = os.environ.get('ARCH_MODE', 'balanced').strip()
          filename = os.environ.get('FILENAME', 'archivo.iso').strip()
          primary_url = os.environ.get('PRIMARY_URL', '').strip()
          fallback_urls = os.environ.get('FALLBACK_URLS', '').strip().split()
          size_bytes = int(os.environ.get('SIZE_BYTES', '0'))
          base_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          if arch_mode == 'midrive_only':
              target_remote = 'midrive'
              account_label = 'Julio Palacios (midrive - 100% Exclusivo)'
          else:
              if nodo_id == 1:
                  target_remote = 'midrive'
                  account_label = 'Julio Palacios (5TB - midrive)'
              else:
                  target_remote = 'midrive2'
                  account_label = 'Vexor Group (5TB - midrive2)'

          dest_file_remote = f"{target_remote}:{base_folder}/nodo_{nodo_id}/{filename}"
          dest_dir_remote = f"{target_remote}:{base_folder}/nodo_{nodo_id}"

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print(f"🚀 INICIANDO NODO {nodo_id} [CUT-THROUGH STREAMING ENGINE]")
          print(f"🎯 Destino Físico: {dest_file_remote} ({account_label})")
          print(f"📦 Tamaño Exacto Declarado: {size_bytes:,} Bytes ({size_bytes / (1024**3):.2f} GB)")
          print(f"🌐 URL Primaria: {primary_url}")
          print("="*70)

          size_mb = size_bytes / (1024 * 1024)
          size_gb = size_bytes / (1024 * 1024 * 1024)

          start_total = time.time()
          streaming_success = False

          # PARADIGMA 1: Cut-Through Streaming Directo (cero disco, descarga y subida concurrentes en RAM)
          try:
              print(f"⚡ Conectando pipe en vivo: [CURL GIGABIT] -> [RCLONE RCAT (256MB Chunks)] -> [GOOGLE DRIVE]...")
              curl_cmd = [
                  'curl', '-sL', '--fail',
                  '--connect-timeout', '15',
                  '--retry', '5', '--retry-delay', '2',
                  '--retry-connrefused',
                  primary_url
              ]
              rclone_cmd = [
                  'rclone', 'rcat', dest_file_remote,
                  f'--size={size_bytes}',
                  '--drive-chunk-size=256M',
                  '--drive-upload-cutoff=256M',
                  '--buffer-size=128M',
                  '--drive-pacer-min-sleep=10ms',
                  '--drive-pacer-burst=200',
                  '--stats=10s',
                  '--stats-one-line',
                  '--retries=5',
                  '--low-level-retries=10'
              ]

              p_curl = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              p_rclone = subprocess.Popen(rclone_cmd, stdin=p_curl.stdout, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              p_curl.stdout.close()

              _, rclone_err = p_rclone.communicate()
              _, curl_err = p_curl.communicate()

              if p_rclone.returncode == 0 and p_curl.returncode == 0:
                  streaming_success = True
                  print("🎉 ¡Cut-Through Streaming completado con éxito absoluto!")
              else:
                  print(f"⚠️ Streaming reportó código no cero: curl={p_curl.returncode}, rclone={p_rclone.returncode}")
                  if rclone_err:
                      print(f"   rclone stderr: {rclone_err.decode('utf-8', errors='ignore')[:300]}")
                  if curl_err:
                      print(f"   curl stderr: {curl_err.decode('utf-8', errors='ignore')[:300]}")
          except Exception as e:
              print(f"⚠️ Excepción en Cut-Through Streaming: {e}")

          # FALLBACK ULTRA-RESILIENTE (Si el pipe directo sufriera corte):
          if not streaming_success:
              print("🔄 Activando motor fallback: Aria2c Multi-Mirror Gigabit + Rclone Turbo...")
              work_dir = f"/tmp/nodo_{nodo_id}_workdir"
              shutil.rmtree(work_dir, ignore_errors=True)
              os.makedirs(work_dir, exist_ok=True)
              all_urls = [primary_url] + fallback_urls
              local_file = os.path.join(work_dir, filename)

              subprocess.run([
                  'aria2c',
                  '--max-connection-per-server=16',
                  '--split=16',
                  '--min-split-size=4M',
                  '--file-allocation=none',
                  '--disk-cache=128M',
                  '--summary-interval=10',
                  '-d', work_dir,
                  '-o', filename
              ] + all_urls, check=True)

              subprocess.run([
                  'rclone', 'copy',
                  local_file, dest_dir_remote,
                  '--drive-chunk-size=256M',
                  '--drive-upload-cutoff=256M',
                  '--transfers=16',
                  '--checkers=16',
                  '--drive-pacer-min-sleep=10ms',
                  '--drive-pacer-burst=200',
                  '--buffer-size=128M',
                  '--use-mmap',
                  '--stats=10s',
                  '--stats-one-line'
              ], check=True)
              shutil.rmtree(work_dir, ignore_errors=True)

          elapsed_node = time.time() - start_total
          e2e_speed = size_mb / max(elapsed_node, 0.001)

          print("")
          print("#"*70)
          print(f"🏆 [NODO {nodo_id}] FINALIZADO EXITOSAMENTE:")
          print(f"📦 Volumen Transferido: {size_gb:.2f} GB ({size_bytes:,} Bytes)")
          print(f"⏱️ Tiempo Total de Nodo: {elapsed_node / 60:.2f} minutos ({elapsed_node:.1f}s)")
          print(f"🚀 Velocidad E2E (Simultánea): {e2e_speed:.2f} MB/s ({e2e_speed * 8:.1f} Mbps)")
          print(f"⚡ Modo Ejecutado: {'Cut-Through Streaming en RAM' if streaming_success else 'Aria2c Multi-Mirror'}")
          print("#"*70)

          notify_tg(
              f"✅ <b>[NODO {nodo_id}] FINALIZADO [CUT-THROUGH]</b>\n\n"
              f"📦 <b>Archivo:</b> {filename} ({size_gb:.2f} GB)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {elapsed_node / 60:.2f} min ({elapsed_node:.1f}s)\n"
              f"⚡ <b>Velocidad E2E:</b> {e2e_speed:.1f} MB/s ({e2e_speed * 8:.1f} Mbps)\n"
              f"🚀 <b>Motor:</b> {'Cut-Through Streaming en RAM' if streaming_success else 'Multi-Mirror Turbo'}\n"
              f"☁️ <b>Destino:</b> <code>{dest_file_remote}</code> ({account_label})"
          )
          EOF

  consolidacion_y_auditoria:
    name: 🏆 Auditoría Consolidada y Certificación de Integridad
    needs: cluster_nodos
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends curl
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Forense y Purga en Google Drive
        env:
          ARCH_MODE: ${{ inputs.architecture_mode }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          arch_mode = os.environ.get('ARCH_MODE', 'balanced').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          if arch_mode == 'midrive_only':
              targets = [
                  ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
                  ('Julio (midrive - Nodo 2)', f'midrive:{folder}/nodo_2')
              ]
              remotes_to_clean = ['midrive']
          else:
              targets = [
                  ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
                  ('Vexor (midrive2 - Nodo 2)', f'midrive2:{folder}/nodo_2')
              ]
              remotes_to_clean = ['midrive', 'midrive2']

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print(f"📊 AUDITORÍA FORENSE DE LA PRUEBA EN GOOGLE DRIVE (Modo: {arch_mode}):")
          print("="*70)

          total_bytes = 0
          total_count = 0

          for label, remote in targets:
              print("")
              print(f"🔍 Auditando {label} en {remote}:")
              res_size = subprocess.run(['rclone', 'size', remote, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', remote])
              try:
                  size_data = json.loads(res_size.stdout)
                  bytes_acc = size_data.get('bytes', 0)
                  count_acc = size_data.get('count', 0)
                  total_bytes += bytes_acc
                  total_count += count_acc
                  print(f"   -> Subtotal {label}: {bytes_acc / (1024*1024*1024):.2f} GB ({count_acc} objetos)")
              except Exception as e:
                  print(f"   ⚠️ Error parseando json de {label}: {e}")

          total_gb = total_bytes / (1024*1024*1024)
          print("")
          print("#"*70)
          print(f"📦 VOLUMEN GLOBAL CONFIRMADO EN GOOGLE DRIVE: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {total_count} objetos")
          print("#"*70)

          if purge:
              print("")
              print("🧹 Purgando carpetas de prueba para preservar 100% de espacio libre...")
              for label, remote in targets:
                  print(f"   -> Purgando {label}: {remote}...")
                  subprocess.run(['rclone', 'purge', remote], check=True)
              for r in remotes_to_clean:
                  subprocess.run(['rclone', 'rmdirs', f'{r}:{folder}'])
              print("✅ Limpieza completada. Verificando estado final:")
              for r in remotes_to_clean:
                  print(f"--- Espacio ocupado en {r}:DESCARGAS_UNIVERSALES ---")
                  subprocess.run(['rclone', 'size', f'{r}:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡CLÚSTER CUT-THROUGH FINALIZADO Y CERTIFICADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado:</b> {total_gb:.2f} GB ({total_count} objetos)\n"
              f"⚡ <b>Modo:</b> {arch_mode.upper()} (2 Servidores Azure en Paralelo)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tus Drives 100% limpios)' if purge else 'Archivos conservados'}\n"
              f"🚀 <b>Resultado:</b> Inyección simultánea en RAM certificada"
          )
          EOF
