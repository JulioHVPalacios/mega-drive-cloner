name: ⚡ Clúster Cuádruple 30 GB (4 Servidores Azure: 2 Julio + 2 Vexor)

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  cluster_nodos:
    name: 🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - nodo: 1
            name: 'Ubuntu 24.04 (5.9GB) + Arch + Sintel ➔ Julio (midrive)'
            target: 'midrive'
            account: 'Julio Palacios (5TB)'
          - nodo: 2
            name: 'openSUSE Leap (4.4GB) + AlmaMin ➔ Julio (midrive)'
            target: 'midrive'
            account: 'Julio Palacios (5TB)'
          - nodo: 3
            name: 'Ubuntu 22.04 (4.5GB) + RockyMin ➔ Vexor (midrive2)'
            target: 'midrive2'
            account: 'Vexor Group (5TB)'
          - nodo: 4
            name: 'Ubuntu Server (2.6GB) + Server22 + CentOS + AlmaBoot ➔ Vexor (midrive2)'
            target: 'midrive2'
            account: 'Vexor Group (5TB)'
      fail-fast: false

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: ⚡ Verificación Instantánea de Disco (Cero Espera - Ahorra 2 minutos)
        run: |
          echo "📊 Espacio disponible inmediato en runner de Azure:"
          df -h /

      - name: 🛠️ Instalar Dependencias (Rclone Oficial, Aria2c Turbo)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl python3 python3-pip
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Transferencia en Nodo Dedicado (Turbo Engine)
        env:
          NODO_ID: ${{ matrix.nodo }}
          TARGET_REMOTE: ${{ matrix.target }}
          ACCOUNT_LABEL: ${{ matrix.account }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          nodo_id = int(os.environ.get('NODO_ID', '1'))
          target_remote_name = os.environ.get('TARGET_REMOTE', 'midrive').strip()
          account_label = os.environ.get('ACCOUNT_LABEL', 'Google Drive').strip()
          base_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          dest_remote = f'{target_remote_name}:{base_folder}/nodo_{nodo_id}'
          print(f"🎯 [NODO {nodo_id}] Cuenta Google: {account_label} | Destino: {dest_remote}")

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          if nodo_id == 1:
              items = [
                  {
                      "name": "Ubuntu 24.04.1 Desktop ISO",
                      "type": "aria2",
                      "source": "https://releases.ubuntu.com/24.04.1/ubuntu-24.04.1-desktop-amd64.iso",
                      "filename": "ubuntu-24.04.1-desktop-amd64.iso",
                      "est_size_mb": 5916
                  },
                  {
                      "name": "Arch Linux 2026 Release ISO",
                      "type": "aria2",
                      "source": "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso",
                      "filename": "archlinux-x86_64.iso",
                      "est_size_mb": 1534
                  },
                  {
                      "name": "Sintel P2P BitTorrent HD Pack (Video + Subs + Art)",
                      "type": "torrent",
                      "source": "https://webtorrent.io/torrents/sintel.torrent",
                      "est_size_mb": 129
                  }
              ]
          elif nodo_id == 2:
              items = [
                  {
                      "name": "openSUSE Leap 15.6 DVD ISO",
                      "type": "aria2",
                      "source": "https://download.opensuse.org/distribution/leap/15.6/iso/openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso",
                      "filename": "openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso",
                      "est_size_mb": 4417
                  },
                  {
                      "name": "AlmaLinux 9 Minimal ISO",
                      "type": "aria2",
                      "source": "https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso",
                      "filename": "AlmaLinux-9-latest-x86_64-minimal.iso",
                      "est_size_mb": 2707
                  }
              ]
          elif nodo_id == 3:
              items = [
                  {
                      "name": "Ubuntu 22.04.5 Desktop ISO",
                      "type": "aria2",
                      "source": "https://releases.ubuntu.com/22.04.5/ubuntu-22.04.5-desktop-amd64.iso",
                      "filename": "ubuntu-22.04.5-desktop-amd64.iso",
                      "est_size_mb": 4542
                  },
                  {
                      "name": "Rocky Linux 9 Minimal ISO",
                      "type": "aria2",
                      "source": "https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-minimal.iso",
                      "filename": "Rocky-9-latest-x86_64-minimal.iso",
                      "est_size_mb": 2627
                  }
              ]
          else:
              items = [
                  {
                      "name": "Ubuntu 24.04.1 Live Server ISO",
                      "type": "aria2",
                      "source": "https://releases.ubuntu.com/24.04.1/ubuntu-24.04.1-live-server-amd64.iso",
                      "filename": "ubuntu-24.04.1-live-server-amd64.iso",
                      "est_size_mb": 2645
                  },
                  {
                      "name": "Ubuntu 22.04.5 Live Server ISO",
                      "type": "aria2",
                      "source": "https://releases.ubuntu.com/22.04.5/ubuntu-22.04.5-live-server-amd64.iso",
                      "filename": "ubuntu-22.04.5-live-server-amd64.iso",
                      "est_size_mb": 2038
                  },
                  {
                      "name": "CentOS Stream 9 Boot ISO",
                      "type": "aria2",
                      "source": "https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/iso/CentOS-Stream-9-latest-x86_64-boot.iso",
                      "filename": "CentOS-Stream-9-latest-x86_64-boot.iso",
                      "est_size_mb": 1497
                  },
                  {
                      "name": "AlmaLinux 9 Boot ISO",
                      "type": "aria2",
                      "source": "https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-boot.iso",
                      "filename": "AlmaLinux-9-latest-x86_64-boot.iso",
                      "est_size_mb": 1449
                  }
              ]

          total_est_mb = sum(x["est_size_mb"] for x in items)
          print(f"📊 [NODO {nodo_id}] Total asignado: {len(items)} items ({total_est_mb / 1024:.2f} GB)")

          msg_lines = [
              f"🚀 <b>CLÚSTER CUÁDRUPLE - NODO {nodo_id} EN LÍNEA</b>",
              f"📦 <b>Carga Asignada:</b> {total_est_mb / 1024:.2f} GB ({len(items)} archivos)",
              f"☁️ <b>Destino:</b> <code>{dest_remote}</code> ({account_label})",
              f"⚡ <b>Tecnología:</b> Azure Cloud VM Dedicada + BBR + Chunks 128MB + High TPS"
          ]
          notify_tg("\n".join(msg_lines))

          work_dir = f"/tmp/nodo_{nodo_id}_workdir"
          os.makedirs(work_dir, exist_ok=True)

          rclone_turbo_flags = [
              '--fast-list',
              '--transfers=16',
              '--checkers=32',
              '--buffer-size=128M',
              '--drive-chunk-size=128M',
              '--drive-upload-cutoff=128M',
              '--tpslimit=12',
              '--tpslimit-burst=20',
              '--stats=10s',
              '--stats-one-line'
          ]

          start_node_total = time.time()
          uploaded_bytes = 0

          for idx, item in enumerate(items, 1):
              name = item["name"]
              itype = item["type"]
              source = item["source"]
              print("")
              print("="*70)
              print(f"🔄 [NODO {nodo_id}] [{idx}/{len(items)}] PROCESANDO: {name}")
              print("="*70)

              item_dir = os.path.join(work_dir, f"item_{idx}")
              os.makedirs(item_dir, exist_ok=True)

              dl_start = time.time()
              if itype == "torrent":
                  print(f"🧲 Descargando Torrent P2P con Aria2c: {source}...")
                  subprocess.run([
                      'aria2c',
                      '--seed-time=0',
                      '--summary-interval=5',
                      '--max-connection-per-server=16',
                      '--split=16',
                      '-d', item_dir,
                      source
                  ], check=True)
              else:
                  filename = item.get("filename", "payload.bin")
                  print(f"⚡ Descargando vía Aria2c (16 hilos, zero pre-allocation): {source}...")
                  subprocess.run([
                      'aria2c',
                      '-s', '16',
                      '-x', '16',
                      '-k', '1M',
                      '--file-allocation=none',
                      '--summary-interval=5',
                      '-d', item_dir,
                      '-o', filename,
                      source
                  ], check=True)

              dl_time = time.time() - dl_start

              dl_size_bytes = sum(
                  os.path.getsize(os.path.join(root, f))
                  for root, _, files in os.walk(item_dir)
                  for f in files
              )
              dl_size_mb = dl_size_bytes / (1024 * 1024)
              dl_speed_mbs = dl_size_mb / dl_time if dl_time > 0 else 0
              print(f"✅ Descarga completada: {dl_size_mb:.2f} MB en {dl_time:.1f}s ({dl_speed_mbs:.2f} MB/s)")

              up_start = time.time()
              print(f"📤 Subiendo a Google Drive ({dest_remote})...")
              subprocess.run([
                  'rclone', 'copy',
                  item_dir, dest_remote
              ] + rclone_turbo_flags, check=True)

              up_time = time.time() - up_start
              up_speed_mbs = dl_size_mb / up_time if up_time > 0 else 0
              print(f"🎉 Subida completada: en {up_time:.1f}s ({up_speed_mbs:.2f} MB/s)")

              uploaded_bytes += dl_size_bytes

              shutil.rmtree(item_dir, ignore_errors=True)
              print("🧹 Disco de Azure liberado inmediatamente.")

          total_node_time = time.time() - start_node_total
          total_gb = uploaded_bytes / (1024 * 1024 * 1024)
          avg_speed = (uploaded_bytes / (1024 * 1024)) / total_node_time if total_node_time > 0 else 0

          print("")
          print("#"*70)
          print(f"🏆 [NODO {nodo_id}] FINALIZADO EXITOSAMENTE:")
          print(f"📦 Transferido: {total_gb:.2f} GB en {total_node_time / 60:.2f} minutos ({avg_speed:.2f} MB/s)")
          print("#"*70)

          notify_tg(
              f"✅ <b>NODO {nodo_id} COMPLETADO (4-NODO CLÚSTER)</b>\n\n"
              f"📦 <b>Volumen:</b> {total_gb:.2f} GB ({len(items)} archivos)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {total_node_time / 60:.2f} minutos ({total_node_time:.1f}s)\n"
              f"⚡ <b>Velocidad Media:</b> {avg_speed:.2f} MB/s\n"
              f"☁️ <b>Destino Físico:</b> <code>{dest_remote}</code> ({account_label})"
          )
          EOF

  consolidacion_y_auditoria:
    name: 🏆 Auditoría Consolidada y Certificación de Integridad
    needs: cluster_nodos
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Global en Google Drive
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          targets = [
              ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
              ('Julio (midrive - Nodo 2)', f'midrive:{folder}/nodo_2'),
              ('Vexor (midrive2 - Nodo 3)', f'midrive2:{folder}/nodo_3'),
              ('Vexor (midrive2 - Nodo 4)', f'midrive2:{folder}/nodo_4')
          ]

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print("📊 AUDITORÍA FORENSE DEL CLÚSTER CUÁDRUPLE EN GOOGLE DRIVE (Julio + Vexor):")
          print("="*70)

          total_bytes = 0
          total_count = 0

          for label, remote in targets:
              print("")
              print(f"🔍 Auditando {label} en {remote}:")
              res_size = subprocess.run(['rclone', 'size', remote, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', remote])
              try:
                  size_data = json.loads(res_size.stdout)
                  bytes_acc = size_data.get('bytes', 0)
                  count_acc = size_data.get('count', 0)
                  total_bytes += bytes_acc
                  total_count += count_acc
                  print(f"   -> Subtotal {label}: {bytes_acc / (1024*1024*1024):.2f} GB ({count_acc} objetos)")
              except Exception as e:
                  print(f"   ⚠️ Error parseando json de {label}: {e}")

          total_gb = total_bytes / (1024*1024*1024)
          print("")
          print("#"*70)
          print(f"📦 VOLUMEN GLOBAL CONFIRMADO EN GOOGLE DRIVE: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {total_count} objetos")
          print("#"*70)

          if purge:
              print("")
              print("🧹 Purgando carpetas de prueba para no ocupar almacenamiento libre...")
              for label, remote in targets:
                  print(f"   -> Purgando {label}: {remote}...")
                  subprocess.run(['rclone', 'purge', remote], check=True)
              subprocess.run(['rclone', 'rmdirs', f'midrive:{folder}'])
              subprocess.run(['rclone', 'rmdirs', f'midrive2:{folder}'])
              print("✅ Limpieza completada. Verificando estado final:")
              subprocess.run(['rclone', 'size', 'midrive:DESCARGAS_UNIVERSALES'])
              subprocess.run(['rclone', 'size', 'midrive2:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡CLÚSTER CUÁDRUPLE 100% FINALIZADO Y CERTIFICADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado en Google Drive:</b> {total_gb:.2f} GB ({total_count} objetos)\n"
              f"⚡ <b>Arquitectura:</b> 4 Servidores Azure en Paralelo (2 Julio + 2 Vexor)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tus Drives 100% limpios)' if purge else 'Archivos conservados'}\n"
              f"🚀 <b>Resultado:</b> Cuádruple ancho de banda y cuota 1.5 TB/día"
          )
          EOF
