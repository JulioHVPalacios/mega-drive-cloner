name: '⚡ Clúster Cuádruple Apex Swarm (4 Nodos Paralelos - 30.8 GB Reales)'

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  cluster_nodos:
    name: 🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - nodo: 1
            name: 'AlmaLinux 9 Min (2.8GB) + openSUSE Leap (4.6GB) ➔ Julio'
            target: 'midrive'
            account: 'Julio Palacios (5TB - midrive)'
            urls: 'https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso https://mirror.uepg.br/opensuse/distribution/leap/15.6/iso/openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso'
          - nodo: 2
            name: 'Ubuntu 24.04 (6.2GB) + Arch Linux (1.1GB) ➔ Julio'
            target: 'midrive'
            account: 'Julio Palacios (5TB - midrive)'
            urls: 'https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso'
          - nodo: 3
            name: 'Rocky Linux 9 Min (2.8GB) + Ubuntu 22.04 (4.8GB) ➔ Vexor'
            target: 'midrive2'
            account: 'Vexor Group (5TB - midrive2)'
            urls: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-minimal.iso https://releases.ubuntu.com/22.04/ubuntu-22.04.5-desktop-amd64.iso'
          - nodo: 4
            name: 'Debian 13 (3.7GB) + Ubuntu Server (3.2GB) + CentOS (1.6GB) ➔ Vexor'
            target: 'midrive2'
            account: 'Vexor Group (5TB - midrive2)'
            urls: 'https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/debian-13.6.0-amd64-DVD-1.iso https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/iso/CentOS-Stream-9-latest-x86_64-boot.iso'
      fail-fast: false

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: ⚡ Acelerador de Arranque (Instalación Binaria Directa sin APT Lag)
        run: |
          sudo apt-get install -y --no-install-recommends aria2
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Transferencia Apex Swarm (Aria2c Multi-URL -i + Chunks 256MB)
        env:
          NODO_ID: ${{ matrix.nodo }}
          TARGET_REMOTE: ${{ matrix.target }}
          ACCOUNT_LABEL: ${{ matrix.account }}
          SOURCE_URLS: ${{ matrix.urls }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          nodo_id = int(os.environ.get('NODO_ID', '1'))
          target_remote = os.environ.get('TARGET_REMOTE', 'midrive').strip()
          account_label = os.environ.get('ACCOUNT_LABEL', '').strip()
          source_urls = os.environ.get('SOURCE_URLS', '').strip().split()
          base_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          dest_remote = f"{target_remote}:{base_folder}/nodo_{nodo_id}"

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print(f"🚀 INICIANDO NODO {nodo_id} [APEX SWARM v8 - 4 NODOS EN PARALELO]")
          print(f"🎯 Destino Físico: {dest_remote} ({account_label})")
          print(f"🌐 Archivos a Transferir ({len(source_urls)} enlaces independientes):")
          for u in source_urls:
              print(f"   -> {u}")
          print("="*70)

          work_dir = f"/tmp/nodo_{nodo_id}_workdir"
          shutil.rmtree(work_dir, ignore_errors=True)
          os.makedirs(work_dir, exist_ok=True)

          # Crear archivo input para Aria2c con un URL por línea (fuerza descarga de CADA archivo por separado)
          input_file = f"/tmp/nodo_{nodo_id}_urls.txt"
          with open(input_file, 'w', encoding='utf-8') as f:
              for u in source_urls:
                  f.write(f"{u}\n")

          start_total = time.time()

          # 1. Descarga Paralela de CADA Archivo con Aria2c (-i fuerza descargas independientes)
          print(f"⚡ [PASO 1] Descargando {len(source_urls)} archivos independientes con Aria2c (-i)...")
          t_dl_start = time.time()
          aria2_cmd = [
              'aria2c',
              '-i', input_file,
              '-j', str(len(source_urls)),
              '--max-connection-per-server=16',
              '--split=16',
              '--min-split-size=5M',
              '--file-allocation=none',
              '--disk-cache=128M',
              '--summary-interval=10',
              '-d', work_dir
          ]

          subprocess.run(aria2_cmd, check=True)
          dl_time = time.time() - t_dl_start

          # Calcular tamaño total descargado
          files = [f for f in os.listdir(work_dir) if os.path.isfile(os.path.join(work_dir, f))]
          total_bytes = sum(os.path.getsize(os.path.join(work_dir, f)) for f in files)
          total_mb = total_bytes / (1024 * 1024)
          total_gb = total_bytes / (1024 * 1024 * 1024)
          dl_speed = total_mb / max(dl_time, 0.001)

          print(f"✅ Descarga completada: {len(files)} archivos ({total_mb:.2f} MB / {total_gb:.2f} GB) en {dl_time:.1f}s ({dl_speed:.2f} MB/s)")
          for f in files:
              sz = os.path.getsize(os.path.join(work_dir, f)) / (1024*1024)
              print(f"   * {f} ({sz:.2f} MB)")

          # 2. Subida Óptima a Google Drive con Chunks de 256MB y Transfers Concurrentes
          print(f"📤 [PASO 2] Inyectando {len(files)} archivos a Google Drive con Chunks de 256MB y transfers=4...")
          t_up_start = time.time()
          rclone_cmd = [
              'rclone', 'copy',
              work_dir, dest_remote,
              '--drive-chunk-size=256M',
              '--drive-upload-cutoff=256M',
              '--transfers=4',
              '--checkers=8',
              '--drive-pacer-min-sleep=10ms',
              '--drive-pacer-burst=200',
              '--buffer-size=64M',
              '--use-mmap',
              '--no-traverse',
              '--stats=10s',
              '--stats-one-line',
              '--retries=5',
              '--low-level-retries=10'
          ]
          subprocess.run(rclone_cmd, check=True)
          up_time = time.time() - t_up_start
          up_speed = total_mb / max(up_time, 0.001)

          print(f"🎉 Subida completada: {total_mb:.2f} MB en {up_time:.1f}s ({up_speed:.2f} MB/s)")

          # Limpieza inmediata de disco en runner
          shutil.rmtree(work_dir, ignore_errors=True)
          if os.path.exists(input_file):
              os.remove(input_file)
          print("🧹 Espacio local liberado inmediatamente.")

          elapsed_node = time.time() - start_total
          avg_speed = total_mb / max(elapsed_node, 0.001)

          print("")
          print("#"*70)
          print(f"🏆 [NODO {nodo_id}] FINALIZADO EXITOSAMENTE:")
          print(f"📦 Volumen Transferido: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {len(files)} archivos")
          print(f"⏱️ Tiempo Total de Nodo: {elapsed_node / 60:.2f} minutos ({elapsed_node:.1f}s)")
          print(f"⚡ Velocidad Neta de Subida: {up_speed:.2f} MB/s ({up_speed * 8:.1f} Mbps)")
          print(f"🚀 Velocidad Promedio E2E: {avg_speed:.2f} MB/s")
          print("#"*70)

          notify_tg(
              f"✅ <b>[NODO {nodo_id}/4] COMPLETADO [APEX SWARM v8]</b>\n\n"
              f"📦 <b>Carga:</b> {len(files)} archivos ({total_gb:.2f} GB)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {elapsed_node / 60:.2f} min ({elapsed_node:.1f}s)\n"
              f"⬇️ <b>Descarga:</b> {dl_speed:.1f} MB/s ({dl_time:.1f}s)\n"
              f"⬆️ <b>Subida a Drive:</b> {up_speed:.1f} MB/s ({up_time:.1f}s)\n"
              f"☁️ <b>Destino:</b> <code>{dest_remote}</code> ({account_label})"
          )
          EOF

  consolidacion_y_auditoria:
    name: 🏆 Auditoría Consolidada y Certificación de Integridad
    needs: cluster_nodos
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Forense y Purga en Google Drive
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          targets = [
              ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
              ('Julio (midrive - Nodo 2)', f'midrive:{folder}/nodo_2'),
              ('Vexor (midrive2 - Nodo 3)', f'midrive2:{folder}/nodo_3'),
              ('Vexor (midrive2 - Nodo 4)', f'midrive2:{folder}/nodo_4')
          ]
          remotes_to_clean = ['midrive', 'midrive2']

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print("📊 AUDITORÍA FORENSE DE LA PRUEBA EN GOOGLE DRIVE (4 NODOS EN PARALELO):")
          print("="*70)

          total_bytes = 0
          total_count = 0

          for label, remote in targets:
              print("")
              print(f"🔍 Auditando {label} en {remote}:")
              res_size = subprocess.run(['rclone', 'size', remote, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', remote])
              try:
                  size_data = json.loads(res_size.stdout)
                  bytes_acc = size_data.get('bytes', 0)
                  count_acc = size_data.get('count', 0)
                  total_bytes += bytes_acc
                  total_count += count_acc
                  print(f"   -> Subtotal {label}: {bytes_acc / (1024*1024*1024):.2f} GB ({count_acc} objetos)")
              except Exception as e:
                  print(f"   ⚠️ Error parseando json de {label}: {e}")

          total_gb = total_bytes / (1024*1024*1024)
          print("")
          print("#"*70)
          print(f"📦 VOLUMEN GLOBAL CONFIRMADO EN GOOGLE DRIVE: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {total_count} objetos")
          print("#"*70)

          if purge:
              print("")
              print("🧹 Purgando carpetas de prueba para preservar 100% de espacio libre...")
              for label, remote in targets:
                  print(f"   -> Purgando {label}: {remote}...")
                  subprocess.run(['rclone', 'purge', remote], check=True)
              for r in remotes_to_clean:
                  subprocess.run(['rclone', 'rmdirs', f'{r}:{folder}'])
              print("✅ Limpieza completada. Verificando estado final:")
              for r in remotes_to_clean:
                  print(f"--- Espacio ocupado en {r}:DESCARGAS_UNIVERSALES ---")
                  subprocess.run(['rclone', 'size', f'{r}:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡CLÚSTER CUÁDRUPLE APEX SWARM v8 FINALIZADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado:</b> {total_gb:.2f} GB ({total_count} objetos)\n"
              f"⚡ <b>Modo:</b> 4 Servidores Azure en Paralelo (2 Julio + 2 Vexor)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tus Drives 100% limpios)' if purge else 'Archivos conservados'}\n"
              f"🚀 <b>Resultado:</b> Arquitectura Enjambre de 30.8 GB Reales"
          )
          EOF
