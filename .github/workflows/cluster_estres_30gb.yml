name: '⚡ Clúster Dual Turbo v6 Hyper-Engine (Máxima Velocidad Física)'

on:
  workflow_dispatch:
    inputs:
      architecture_mode:
        description: '⚡ Arquitectura de Destino'
        required: true
        default: 'balanced'
        type: choice
        options:
          - 'balanced'
          - 'midrive_only'
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  cluster_nodos:
    name: 🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - nodo: 1
            name: 'AlmaLinux 9 DVD (15.2GB Hyper-Engine)'
            filename: 'AlmaLinux-9-latest-x86_64-dvd.iso'
            urls: 'https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso https://mirrors.ircam.fr/pub/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso https://mirror.nl.leaseweb.net/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso'
          - nodo: 2
            name: 'Rocky Linux 9 DVD (15.2GB Hyper-Engine)'
            filename: 'Rocky-9-latest-x86_64-dvd.iso'
            urls: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso https://rocky-linux-europe-west4.s3.nl-ams.scw.cloud/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso https://mirrors.ircam.fr/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso https://mirror.oxilion.nl/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso'
      fail-fast: false

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: ⚡ Acelerador de Arranque (Instalación Binaria Directa sin APT Lag)
        run: |
          sudo apt-get install -y --no-install-recommends aria2
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Transferencia Hyper-Engine (Multi-Stream + Chunks 512MB)
        env:
          NODO_ID: ${{ matrix.nodo }}
          ARCH_MODE: ${{ inputs.architecture_mode }}
          FILENAME: ${{ matrix.filename }}
          SOURCE_URLS: ${{ matrix.urls }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          nodo_id = int(os.environ.get('NODO_ID', '1'))
          arch_mode = os.environ.get('ARCH_MODE', 'balanced').strip()
          filename = os.environ.get('FILENAME', 'archivo.iso').strip()
          source_urls = os.environ.get('SOURCE_URLS', '').strip().split()
          base_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          if arch_mode == 'midrive_only':
              target_remote = 'midrive'
              account_label = 'Julio Palacios (midrive - 100% Exclusivo)'
          else:
              if nodo_id == 1:
                  target_remote = 'midrive'
                  account_label = 'Julio Palacios (5TB - midrive)'
              else:
                  target_remote = 'midrive2'
                  account_label = 'Vexor Group (5TB - midrive2)'

          dest_remote = f"{target_remote}:{base_folder}/nodo_{nodo_id}"

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print(f"🚀 INICIANDO NODO {nodo_id} [HYPER-ENGINE v6]")
          print(f"🎯 Destino Físico: {dest_remote} ({account_label})")
          print(f"🌐 Fuentes Multi-Mirror ({len(source_urls)} espejos concurrentes):")
          for u in source_urls:
              print(f"   -> {u}")
          print("="*70)

          work_dir = f"/tmp/nodo_{nodo_id}_workdir"
          shutil.rmtree(work_dir, ignore_errors=True)
          os.makedirs(work_dir, exist_ok=True)
          local_filepath = os.path.join(work_dir, filename)

          start_total = time.time()

          # 1. Descarga Hyper-Stream con Aria2c (32 hilos concurrentes, 1MB min-split, 256MB cache)
          print(f"⚡ [PASO 1] Descargando {filename} con Aria2c Hyper-Stream (32 hilos concurrentes)...")
          t_dl_start = time.time()
          aria2_cmd = [
              'aria2c',
              '--max-connection-per-server=16',
              '--split=32',
              '--min-split-size=1M',
              '--file-allocation=none',
              '--disk-cache=256M',
              '--summary-interval=10',
              '-d', work_dir,
              '-o', filename
          ] + source_urls

          subprocess.run(aria2_cmd, check=True)
          dl_time = time.time() - t_dl_start
          file_size_bytes = os.path.getsize(local_filepath)
          file_size_mb = file_size_bytes / (1024 * 1024)
          file_size_gb = file_size_bytes / (1024 * 1024 * 1024)
          dl_speed = file_size_mb / max(dl_time, 0.001)

          print(f"✅ Descarga completada: {file_size_mb:.2f} MB en {dl_time:.1f}s ({dl_speed:.2f} MB/s)")

          # 2. Subida Hyper-Engine a Google Drive (Bloques Gigantes de 512MB + No-Traverse + Buffer 256MB)
          print(f"📤 [PASO 2] Inyectando {filename} a Google Drive con Chunks de 512MB...")
          t_up_start = time.time()
          rclone_cmd = [
              'rclone', 'copy',
              local_filepath, dest_remote,
              '--drive-chunk-size=512M',
              '--drive-upload-cutoff=512M',
              '--transfers=16',
              '--checkers=16',
              '--drive-pacer-min-sleep=10ms',
              '--drive-pacer-burst=200',
              '--buffer-size=256M',
              '--use-mmap',
              '--no-traverse',
              '--stats=10s',
              '--stats-one-line',
              '--retries=5',
              '--low-level-retries=10'
          ]
          subprocess.run(rclone_cmd, check=True)
          up_time = time.time() - t_up_start
          up_speed = file_size_mb / max(up_time, 0.001)

          print(f"🎉 Subida completada: {file_size_mb:.2f} MB en {up_time:.1f}s ({up_speed:.2f} MB/s)")

          # Limpieza inmediata de disco
          shutil.rmtree(work_dir, ignore_errors=True)
          print("🧹 Espacio local liberado inmediatamente.")

          elapsed_node = time.time() - start_total
          avg_speed = file_size_mb / max(elapsed_node, 0.001)

          print("")
          print("#"*70)
          print(f"🏆 [NODO {nodo_id}] FINALIZADO EXITOSAMENTE:")
          print(f"📦 Volumen Transferido: {file_size_gb:.2f} GB ({file_size_bytes:,} Bytes)")
          print(f"⏱️ Tiempo Total de Nodo: {elapsed_node / 60:.2f} minutos ({elapsed_node:.1f}s)")
          print(f"⚡ Velocidad Neta de Subida: {up_speed:.2f} MB/s ({up_speed * 8:.1f} Mbps)")
          print(f"🚀 Velocidad Promedio E2E: {avg_speed:.2f} MB/s")
          print("#"*70)

          notify_tg(
              f"✅ <b>[NODO {nodo_id}] COMPLETADO [HYPER-ENGINE v6]</b>\n\n"
              f"📦 <b>Archivo:</b> {filename} ({file_size_gb:.2f} GB)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {elapsed_node / 60:.2f} min ({elapsed_node:.1f}s)\n"
              f"⬇️ <b>Descarga:</b> {dl_speed:.1f} MB/s ({dl_time:.1f}s)\n"
              f"⬆️ <b>Subida a Drive:</b> {up_speed:.1f} MB/s ({up_time:.1f}s)\n"
              f"☁️ <b>Destino:</b> <code>{dest_remote}</code> ({account_label})"
          )
          EOF

  consolidacion_y_auditoria:
    name: 🏆 Auditoría Consolidada y Certificación de Integridad
    needs: cluster_nodos
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Forense y Purga en Google Drive
        env:
          ARCH_MODE: ${{ inputs.architecture_mode }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          arch_mode = os.environ.get('ARCH_MODE', 'balanced').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          if arch_mode == 'midrive_only':
              targets = [
                  ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
                  ('Julio (midrive - Nodo 2)', f'midrive:{folder}/nodo_2')
              ]
              remotes_to_clean = ['midrive']
          else:
              targets = [
                  ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
                  ('Vexor (midrive2 - Nodo 2)', f'midrive2:{folder}/nodo_2')
              ]
              remotes_to_clean = ['midrive', 'midrive2']

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print(f"📊 AUDITORÍA FORENSE DE LA PRUEBA EN GOOGLE DRIVE (Modo: {arch_mode}):")
          print("="*70)

          total_bytes = 0
          total_count = 0

          for label, remote in targets:
              print("")
              print(f"🔍 Auditando {label} en {remote}:")
              res_size = subprocess.run(['rclone', 'size', remote, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', remote])
              try:
                  size_data = json.loads(res_size.stdout)
                  bytes_acc = size_data.get('bytes', 0)
                  count_acc = size_data.get('count', 0)
                  total_bytes += bytes_acc
                  total_count += count_acc
                  print(f"   -> Subtotal {label}: {bytes_acc / (1024*1024*1024):.2f} GB ({count_acc} objetos)")
              except Exception as e:
                  print(f"   ⚠️ Error parseando json de {label}: {e}")

          total_gb = total_bytes / (1024*1024*1024)
          print("")
          print("#"*70)
          print(f"📦 VOLUMEN GLOBAL CONFIRMADO EN GOOGLE DRIVE: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {total_count} objetos")
          print("#"*70)

          if purge:
              print("")
              print("🧹 Purgando carpetas de prueba para preservar 100% de espacio libre...")
              for label, remote in targets:
                  print(f"   -> Purgando {label}: {remote}...")
                  subprocess.run(['rclone', 'purge', remote], check=True)
              for r in remotes_to_clean:
                  subprocess.run(['rclone', 'rmdirs', f'{r}:{folder}'])
              print("✅ Limpieza completada. Verificando estado final:")
              for r in remotes_to_clean:
                  print(f"--- Espacio ocupado en {r}:DESCARGAS_UNIVERSALES ---")
                  subprocess.run(['rclone', 'size', f'{r}:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡CLÚSTER HYPER-ENGINE v6 FINALIZADO Y CERTIFICADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado:</b> {total_gb:.2f} GB ({total_count} objetos)\n"
              f"⚡ <b>Modo:</b> {arch_mode.upper()} (2 Servidores Azure en Paralelo)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tus Drives 100% limpios)' if purge else 'Archivos conservados'}\n"
              f"🚀 <b>Resultado:</b> Máxima velocidad física demostrable alcanzada"
          )
          EOF
