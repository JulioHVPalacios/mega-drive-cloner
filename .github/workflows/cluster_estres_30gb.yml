name: '⚡ Clúster Dual Balanceado 30 GB (1 Julio + 1 Vexor a 90 MB/s)'

on:
  workflow_dispatch:
    inputs:
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4'
        type: string
      purge_after_test:
        description: '🧹 ¿Purgar tras auditar? (true = conserva tus 10 TB libres)'
        required: true
        default: true
        type: boolean

jobs:
  cluster_nodos:
    name: 🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - nodo: 1
            name: 'AlmaLinux 9 (15.2GB) ➔ Julio (midrive)'
            target: 'midrive'
            account: 'Julio Palacios (5TB - midrive)'
            filename: 'AlmaLinux-9-latest-x86_64-dvd.iso'
            url: 'https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso'
            size_mb: 15152
          - nodo: 2
            name: 'Rocky Linux 9 (15.2GB) ➔ Vexor (midrive2)'
            target: 'midrive2'
            account: 'Vexor Group (5TB - midrive2)'
            filename: 'Rocky-9-latest-x86_64-dvd.iso'
            url: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso'
            size_mb: 15194
      fail-fast: false

    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: ⚡ Verificación Instantánea de Disco (Cero Espera - Ahorra 2 minutos)
        run: |
          echo "📊 Espacio disponible inmediato en runner de Azure:"
          df -h /

      - name: 🛠️ Instalar Dependencias (Rclone Oficial, Aria2c Turbo)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl python3 python3-pip
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Transferencia en Nodo Dedicado (Turbo Engine)
        env:
          NODO_ID: ${{ matrix.nodo }}
          TARGET_REMOTE: ${{ matrix.target }}
          ACCOUNT_LABEL: ${{ matrix.account }}
          FILENAME: ${{ matrix.filename }}
          SOURCE_URL: ${{ matrix.url }}
          SIZE_MB: ${{ matrix.size_mb }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          nodo_id = int(os.environ.get('NODO_ID', '1'))
          target_remote_name = os.environ.get('TARGET_REMOTE', 'midrive').strip()
          account_label = os.environ.get('ACCOUNT_LABEL', 'Google Drive').strip()
          filename = os.environ.get('FILENAME', 'payload.iso').strip()
          source_url = os.environ.get('SOURCE_URL', '').strip()
          size_mb = float(os.environ.get('SIZE_MB', '15000'))
          base_folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          dest_remote = f'{target_remote_name}:{base_folder}/nodo_{nodo_id}'
          print(f"🎯 [NODO {nodo_id}] Cuenta Google: {account_label} | Destino: {dest_remote}")

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          msg_lines = [
              f"🚀 <b>CLÚSTER DUAL SIMÉTRICO - NODO {nodo_id} EN LÍNEA</b>",
              f"📦 <b>Archivo Masivo:</b> {filename} ({size_mb / 1024:.2f} GB)",
              f"☁️ <b>Destino Exclusivo:</b> <code>{dest_remote}</code> ({account_label})",
              f"⚡ <b>Tecnología:</b> Canal Puro Incontestado a 90 MB/s"
          ]
          notify_tg("\n".join(msg_lines))

          work_dir = f"/tmp/nodo_{nodo_id}_workdir"
          os.makedirs(work_dir, exist_ok=True)

          start_node_total = time.time()

          print("")
          print("="*70)
          print(f"🔄 [NODO {nodo_id}] DESCARGANDO: {filename} ({size_mb / 1024:.2f} GB)")
          print("="*70)

          dl_start = time.time()
          subprocess.run([
              'aria2c',
              '-s', '16',
              '-x', '16',
              '-k', '1M',
              '--file-allocation=none',
              '--summary-interval=5',
              '-d', work_dir,
              '-o', filename,
              source_url
          ], check=True)
          dl_time = time.time() - dl_start

          filepath = os.path.join(work_dir, filename)
          dl_size_bytes = os.path.getsize(filepath)
          dl_size_mb = dl_size_bytes / (1024 * 1024)
          dl_speed_mbs = dl_size_mb / dl_time if dl_time > 0 else 0
          print(f"✅ Descarga completada: {dl_size_mb:.2f} MB en {dl_time:.1f}s ({dl_speed_mbs:.2f} MB/s)")

          print("")
          print("="*70)
          print(f"📤 [NODO {nodo_id}] SUBIENDO A GOOGLE DRIVE ({dest_remote})...")
          print("="*70)

          rclone_turbo_flags = [
              '--fast-list',
              '--transfers=16',
              '--checkers=32',
              '--buffer-size=128M',
              '--drive-chunk-size=128M',
              '--drive-upload-cutoff=128M',
              '--tpslimit=12',
              '--tpslimit-burst=20',
              '--stats=10s',
              '--stats-one-line'
          ]

          up_start = time.time()
          subprocess.run([
              'rclone', 'copy',
              filepath, dest_remote
          ] + rclone_turbo_flags, check=True)
          up_time = time.time() - up_start
          up_speed_mbs = dl_size_mb / up_time if up_time > 0 else 0
          print(f"🎉 Subida completada: en {up_time:.1f}s ({up_speed_mbs:.2f} MB/s)")

          shutil.rmtree(work_dir, ignore_errors=True)
          print("🧹 Disco de Azure liberado inmediatamente.")

          total_node_time = time.time() - start_node_total
          total_gb = dl_size_bytes / (1024 * 1024 * 1024)
          avg_speed = dl_size_mb / total_node_time if total_node_time > 0 else 0

          print("")
          print("#"*70)
          print(f"🏆 [NODO {nodo_id}] FINALIZADO EXITOSAMENTE:")
          print(f"📦 Transferido: {total_gb:.2f} GB en {total_node_time / 60:.2f} minutos ({avg_speed:.2f} MB/s)")
          print("#"*70)

          notify_tg(
              f"✅ <b>NODO {nodo_id} COMPLETADO (CLÚSTER DUAL SIMÉTRICO)</b>\n\n"
              f"📦 <b>Archivo:</b> {filename} ({total_gb:.2f} GB)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {total_node_time / 60:.2f} minutos ({total_node_time:.1f}s)\n"
              f"⚡ <b>Velocidad Subida:</b> {up_speed_mbs:.2f} MB/s\n"
              f"☁️ <b>Destino Físico:</b> <code>{dest_remote}</code> ({account_label})"
          )
          EOF

  consolidacion_y_auditoria:
    name: 🏆 Auditoría Consolidada y Certificación de Integridad
    needs: cluster_nodos
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl
          curl https://rclone.org/install.sh | sudo bash

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Global en Google Drive
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_cluster_30gb_v4').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          targets = [
              ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
              ('Vexor (midrive2 - Nodo 2)', f'midrive2:{folder}/nodo_2')
          ]

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          print("")
          print("="*70)
          print("📊 AUDITORÍA FORENSE DEL CLÚSTER DUAL SIMÉTRICO (Julio + Vexor):")
          print("="*70)

          total_bytes = 0
          total_count = 0

          for label, remote in targets:
              print("")
              print(f"🔍 Auditando {label} en {remote}:")
              res_size = subprocess.run(['rclone', 'size', remote, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', remote])
              try:
                  size_data = json.loads(res_size.stdout)
                  bytes_acc = size_data.get('bytes', 0)
                  count_acc = size_data.get('count', 0)
                  total_bytes += bytes_acc
                  total_count += count_acc
                  print(f"   -> Subtotal {label}: {bytes_acc / (1024*1024*1024):.2f} GB ({count_acc} objetos)")
              except Exception as e:
                  print(f"   ⚠️ Error parseando json de {label}: {e}")

          total_gb = total_bytes / (1024*1024*1024)
          print("")
          print("#"*70)
          print(f"📦 VOLUMEN GLOBAL CONFIRMADO EN GOOGLE DRIVE: {total_gb:.2f} GB ({total_bytes:,} Bytes) en {total_count} objetos")
          print("#"*70)

          if purge:
              print("")
              print("🧹 Purgando carpetas de prueba para no ocupar almacenamiento libre...")
              for label, remote in targets:
                  print(f"   -> Purgando {label}: {remote}...")
                  subprocess.run(['rclone', 'purge', remote], check=True)
              subprocess.run(['rclone', 'rmdirs', f'midrive:{folder}'])
              subprocess.run(['rclone', 'rmdirs', f'midrive2:{folder}'])
              print("✅ Limpieza completada. Verificando estado final:")
              subprocess.run(['rclone', 'size', 'midrive:DESCARGAS_UNIVERSALES'])
              subprocess.run(['rclone', 'size', 'midrive2:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡CLÚSTER DUAL SIMÉTRICO FINALIZADO Y CERTIFICADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado:</b> {total_gb:.2f} GB ({total_count} objetos)\n"
              f"⚡ <b>Arquitectura:</b> 2 Servidores Azure en Paralelo (Julio 15GB + Vexor 15GB)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tus Drives 100% limpios)' if purge else 'Archivos conservados'}\n"
              f"🚀 <b>Resultado:</b> Doble canal incontestado a 90 MB/s cada uno"
          )
          EOF
