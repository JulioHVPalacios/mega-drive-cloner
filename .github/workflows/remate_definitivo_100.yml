            dst_sub: "2.✴️🧑‍💻𝗖𝗨𝗥𝗦𝗢𝗦 𝗗𝗘 𝗣𝗥𝗢𝗚𝗥𝗔𝗠𝗔𝗖𝗜Ó𝗡 𝗗𝗘 𝗕Á𝗦𝗜𝗖𝗢 𝗔 𝗔𝗩𝗔𝗡𝗭𝗔𝗗𝗢🧠" 
          - id: "carpeta5_sync"
            nombre: "Carpeta 5 Sync Faltantes"
            tipo: "sync_f5"
