            dst_sub: "5. NUEVAS ACTUALIZACIONES" 

    steps:
      - name: 🛠️ Instalar Rclone Oficial
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: 🚀 Transferir a Máxima Velocidad (Directo a midrive2)
        run: |
          if [ "${{ matrix.tipo }}" = "curso_f8" ]; then
            SRC="midrive,root_folder_id=1div78uW-iUyTkzW-QXCGfPlYxgOzZ6te:${{ matrix.src_sub }}"
          else
            SRC="midrive,root_folder_id=1TCTh_B3E_ztPGOznWL75yrymywJrKLJl:${{ matrix.src_sub }}"
          fi
          
          DST="midrive2:MEGAPACK_PROGRAMACION_COMPLETO/${{ matrix.dst_sub }}"
          
          echo "Iniciando transferencia de: ${{ matrix.nombre }}"
          echo "Origen: $SRC"
          echo "Destino: $DST"
          
          rclone copy "$SRC" "$DST" \
            --fast-list \
            --transfers=16 \
            --checkers=32 \
            --buffer-size=256M \
            --use-mmap \
            --retries=10 \
            --low-level-retries=20 \
            -v -P --stats 15s
            
          echo "✅ ${{ matrix.nombre }} completado con éxito."

