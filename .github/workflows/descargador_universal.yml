name: 🚀 Descargador Universal Extremo a Cualquier Nube

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: '1️⃣ [OBLIGATORIO] Pega aquí tu enlace (HTTP, ISO de foro, Google Drive, Mega, TeraBox o Torrent/Magnet)'
        required: true
        type: string
      destination_target:
        description: '2️⃣ [ELIGE DESTINO] ¿A dónde mandarlo?'
        required: true
        default: 'Google Drive (Rotación Inteligente: Julio + Vexor 10TB)'
        type: choice
        options:
          - 'Google Drive (Rotación Inteligente: Julio + Vexor 10TB)'
          - 'Google Drive (Mi Unidad Principal - Julio)'
          - 'Google Drive (Unidad Auxiliar - Vexor)'
          - 'Microsoft OneDrive (Aviso: Throttling 429)'
          - 'Nube Desconocida / Genérica (WebDAV / AList / PikPak)'
          - 'Almacenamiento S3 Compatible (Wasabi, R2, B2, Minio)'
          - 'Servidor Remoto (FTP / SFTP)'
          - 'MEGA.nz'
      dest_folder:
        description: '3️⃣ [CARPETA] Nombre de la carpeta en tu nube (ej: Mis_ISOS o Descargas_2026)'
        required: true
        default: 'DESCARGAS_UNIVERSALES'
        type: string
      custom_credentials:
        description: '4️⃣ [¡DEJAR EN BLANCO!] (Solo se llena si elegiste una nube desconocida o externa)'
        required: false
        default: ''
        type: string
      transfer_mode:
        description: '5️⃣ [MODO DE TRANSFERENCIA] Calibrado para máxima velocidad'
        required: true
        default: 'Auto Streaming RAM Turbo (Zero Disco - Soporta 500GB/1TB/2TB)'
        type: choice
        options:
          - 'Auto Streaming RAM Turbo (Zero Disco - Soporta 500GB/1TB/2TB)'
          - 'Acelerador Multi-Conexión Aria2c (16 hilos por archivo)'
          - 'Motor Torrent / Magnet P2P Turbo'

jobs:
  descarga_universal_extrema:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: 🛠️ Instalar Motores de Alta Velocidad Oficiales (Rclone, Aria2, Megatools, yt-dlp)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl python3 python3-pip megatools ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          curl https://rclone.org/install.sh | sudo bash
          echo "✅ Motores oficiales verificados:"
          rclone --version | head -n 2
          aria2c --version | head -n 1
          megatools --version | head -n 1
          yt-dlp --version

      - name: 🧹 Optimizar Espacio en Disco Temporal de Azure (Hasta 65-70 GB Libres)
        run: |
          SOURCE="${{ inputs.source_url }}"
          MODE="${{ inputs.transfer_mode }}"
          if [[ "$MODE" == *"Torrent"* ]] || [[ "$SOURCE" == *"magnet:"* ]] || [[ "$SOURCE" == *".torrent"* ]] || [[ "$MODE" == *"Aria2"* ]]; then
            echo "🧲 Modo Torrent/Pesado detectado: liberando espacio en disco..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /imagegeneration || true
            sudo docker image prune -a -f || true
            echo "✅ Disco optimizado al máximo para permitir Torrents e ISOs de hasta 50-60 GB."
          else
            echo "⚡ Modo Streaming RAM: no requiere limpieza de disco."
          fi
          df -h /

      - name: 🔐 Inyectar y Configurar Remotos Seguros
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          DEST_TARGET: ${{ inputs.destination_target }}
          CREDENTIALS: ${{ inputs.custom_credentials }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, re

          target = os.environ.get('DEST_TARGET', '')
          creds_raw = os.environ.get('CREDENTIALS', '').strip()

          def parse_creds(raw):
              params = {}
              items = [x.strip() for x in raw.split(';') if '=' in x]
              for item in items:
                  k, v = item.split('=', 1)
                  params[k.strip().lower()] = v.strip()
              return params

          creds = parse_creds(creds_raw)

          if 'WebDAV' in target and 'url' in creds:
              print('🌐 Configurando WebDAV para nube externa...')
              url = creds.get('url', '')
              user = creds.get('user', '')
              pwd = creds.get('pass', '')
              obs_pwd = subprocess.check_output(['rclone', 'obscure', pwd]).decode().strip() if pwd else ''
              cmd = [
                  'rclone', 'config', 'create', 'target_remote', 'webdav',
                  f'url={url}', 'vendor=other', f'user={user}', f'pass={obs_pwd}'
              ]
              subprocess.run(cmd, check=True)

          elif 'S3' in target and 'endpoint' in creds:
              print('☁️ Configurando S3 Compatible...')
              endpoint = creds.get('endpoint', '')
              ak = creds.get('access_key', creds.get('ak', ''))
              sk = creds.get('secret_key', creds.get('sk', ''))
              cmd = [
                  'rclone', 'config', 'create', 'target_remote', 's3',
                  'provider=Other', f'endpoint={endpoint}',
                  f'access_key_id={ak}', f'secret_access_key={sk}'
              ]
              subprocess.run(cmd, check=True)

          elif 'MEGA' in target and 'user' in creds:
              print('🔴 Configurando MEGA...')
              user = creds.get('user', '')
              pwd = creds.get('pass', '')
              obs_pwd = subprocess.check_output(['rclone', 'obscure', pwd]).decode().strip() if pwd else ''
              cmd = [
                  'rclone', 'config', 'create', 'target_remote', 'mega',
                  f'user={user}', f'pass={obs_pwd}'
              ]
              subprocess.run(cmd, check=True)

          elif 'FTP' in target and 'host' in creds:
              print('📁 Configurando FTP/SFTP...')
              host = creds.get('host', '')
              user = creds.get('user', '')
              pwd = creds.get('pass', '')
              obs_pwd = subprocess.check_output(['rclone', 'obscure', pwd]).decode().strip() if pwd else ''
              is_sftp = 'sftp' in creds.get('type', target.lower())
              backend = 'sftp' if is_sftp else 'ftp'
              cmd = [
                  'rclone', 'config', 'create', 'target_remote', backend,
                  f'host={host}', f'user={user}', f'pass={obs_pwd}'
              ]
              subprocess.run(cmd, check=True)
          EOF
          echo "✅ Remotes activos y listos:"
          rclone listremotes

      - name: ⚡ Ejecutar Motor Universal con Optimización Extrema
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          DEST_TARGET: ${{ inputs.destination_target }}
          DEST_FOLDER: ${{ inputs.dest_folder }}
          TRANSFER_MODE: ${{ inputs.transfer_mode }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, re, subprocess, sys, shutil

          source = os.environ.get('SOURCE_URL', '').strip()
          target_choice = os.environ.get('DEST_TARGET', '').strip()
          folder = os.environ.get('DEST_FOLDER', '').strip()
          mode = os.environ.get('TRANSFER_MODE', '').strip()

          is_gdrive_rot = 'Rotación Inteligente' in target_choice
          is_gdrive_julio = 'Julio' in target_choice
          is_gdrive_vexor = 'Vexor' in target_choice
          is_onedrive = 'OneDrive' in target_choice

          if is_gdrive_rot:
              dest_remote = f'midrive:{folder}'
              fallback_remote = f'midrive2:{folder}'
          elif is_gdrive_vexor:
              dest_remote = f'midrive2:{folder}'
              fallback_remote = None
          elif is_gdrive_julio:
              dest_remote = f'midrive:{folder}'
              fallback_remote = None
          elif is_onedrive:
              dest_remote = f'onedrive:{folder}'
              fallback_remote = None
          else:
              dest_remote = f'target_remote:{folder}'
              fallback_remote = None

          print(f'🎯 Destino Principal: {dest_remote}')
          if fallback_remote:
              print(f'🔄 Destino Respaldo (Failover 750GB): {fallback_remote}')
          print(f'📦 Origen: {source}')
          print(f'⚡ Modo: {mode}')

          # Banderas maestras de velocidad extrema y verificación criptográfica (Cero corrupción y Cero OOM)
          turbo_flags = [
              '--fast-list',
              '--transfers=16',
              '--checkers=32',
              '--buffer-size=128M',
              '--use-mmap',
              '--multi-thread-streams=16',
              '--multi-thread-cutoff=32M',
              '--retries=10',
              '--low-level-retries=20',
              '--retries-sleep=5s',
              '--checksum'
          ]

          if 'midrive' in dest_remote:
              turbo_flags.extend([
                  '--drive-chunk-size=256M',
                  '--drive-pacer-min-sleep=10ms',
                  '--drive-pacer-burst=200'
              ])
          elif is_onedrive:
              turbo_flags.extend([
                  '--onedrive-chunk-size=250M'
              ])

          def run_with_failover(cmd_primary, cmd_fallback=None):
              try:
                  print("🚀 Ejecutando transferencia en destino principal...")
                  subprocess.run(cmd_primary, check=True)
              except subprocess.CalledProcessError as e:
                  if cmd_fallback and fallback_remote:
                      print("⚠️ Límite de cuota o error detectado en cuenta 1. Conmutando a cuenta 2 (Failover)...")
                      subprocess.run(cmd_fallback, check=True)
                  else:
                      raise e

          # CASO 1: Torrents / Magnet Links
          if source.startswith('magnet:') or source.endswith('.torrent'):
              print('🧲 Detectado Torrent/Magnet. Iniciando Aria2c BitTorrent Turbo...')
              os.makedirs('/tmp/torrent_downloads', exist_ok=True)
              aria_cmd = [
                  'aria2c',
                  '--seed-time=0',
                  '--max-connection-per-server=16',
                  '--split=16',
                  '--min-split-size=1M',
                  '--enable-dht=true',
                  '--summary-interval=15',
                  '-d', '/tmp/torrent_downloads',
                  source
              ]
              subprocess.run(aria_cmd, check=True)
              print('📤 Subiendo enjambre hacia la nube destino con chunks de 128MB...')
              cmd1 = ['rclone', 'copy', '/tmp/torrent_downloads', dest_remote] + turbo_flags + ['-P', '-v']
              cmd2 = ['rclone', 'copy', '/tmp/torrent_downloads', fallback_remote] + turbo_flags + ['-P', '-v'] if fallback_remote else None
              run_with_failover(cmd1, cmd2)

          # CASO 2: Enlaces de MEGA.nz (Archivos o Carpetas Públicas)
          elif 'mega.nz/' in source:
              print('🔴 Detectado enlace MEGA.nz. Iniciando descarga con Megatools nativo...')
              os.makedirs('/tmp/mega_downloads', exist_ok=True)
              mega_cmd = ['megatools', 'dl', '--path', '/tmp/mega_downloads', source]
              subprocess.run(mega_cmd, check=True)
              print('📤 Subiendo contenido de MEGA hacia tu nube destino...')
              cmd1 = ['rclone', 'copy', '/tmp/mega_downloads', dest_remote] + turbo_flags + ['-P', '-v']
              cmd2 = ['rclone', 'copy', '/tmp/mega_downloads', fallback_remote] + turbo_flags + ['-P', '-v'] if fallback_remote else None
              run_with_failover(cmd1, cmd2)

          # CASO 3: Streams de Video Multimedia (YouTube, Vimeo, Twitch, HLS, .m3u8, .mpd)
          elif any(k in source.lower() for k in ['youtube.com', 'youtu.be', 'vimeo.com', '.m3u8', '.mpd', 'twitch.tv']):
              print('🎬 Detectado stream de video / multimedia. Descargando con yt-dlp Turbo...')
              os.makedirs('/tmp/stream_downloads', exist_ok=True)
              ytdlp_cmd = [
                  'yt-dlp',
                  '--concurrent-fragments', '16',
                  '--buffer-size', '64K',
                  '-o', '/tmp/stream_downloads/%(title)s.%(ext)s',
                  source
              ]
              subprocess.run(ytdlp_cmd, check=True)
              print('📤 Subiendo video(s) hacia tu nube destino...')
              cmd1 = ['rclone', 'copy', '/tmp/stream_downloads', dest_remote] + turbo_flags + ['-P', '-v']
              cmd2 = ['rclone', 'copy', '/tmp/stream_downloads', fallback_remote] + turbo_flags + ['-P', '-v'] if fallback_remote else None
              run_with_failover(cmd1, cmd2)

          # CASO 4: Google Drive a Google Drive (Server-Side Direct)
          elif ('drive.google.com' in source or (len(source) in [33, 44] and not source.startswith('http'))) and ('midrive' in dest_remote):
              m = re.search(r'[-\w]{25,}', source)
              fid = m.group(0) if m else source
              print(f'📁 Clonando Server-Side interno Google con ID: {fid}')
              cmd1 = [
                  'rclone', 'copy',
                  f'midrive,root_folder_id={fid}:',
                  dest_remote,
                  '--drive-server-side-across-configs=true'
              ] + turbo_flags + ['-P', '-v', '--stats', '15s']
              cmd2 = [
                  'rclone', 'copy',
                  f'midrive,root_folder_id={fid}:',
                  fallback_remote,
                  '--drive-server-side-across-configs=true'
              ] + turbo_flags + ['-P', '-v', '--stats', '15s'] if fallback_remote else None
              run_with_failover(cmd1, cmd2)

          # CASO 5: Enlaces HTTP/HTTPS Directos (ISOs gigantes en Foros, TeraBox, Servidores Web)
          elif source.startswith('http://') or source.startswith('https://'):
              if any(k in source.lower() for k in ['terabox', '1024tera', 'mirrobox', '4funbox']):
                  print('📦 Detectado enlace TeraBox. Preparando ingestión directa...')

              if 'Streaming RAM' in mode:
                  print('🌊 Activando Streaming en Memoria RAM con Chunks Turbo (Zero Disco)...')
                  print('🚀 Este modo transfiere ISOs gigantes de 500GB/1TB/2TB directo a tu nube!')
                  http_flags = [f for f in turbo_flags if f != '--checksum']
                  cmd1 = [
                      'rclone', 'copyurl',
                      source,
                      f"{dest_remote.rstrip('/')}/",
                      '--auto-filename',
                      '--user-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  ] + http_flags + ['-P', '-v', '--stats', '15s']
                  cmd2 = [
                      'rclone', 'copyurl',
                      source,
                      f"{fallback_remote.rstrip('/')}/" if fallback_remote else "",
                      '--auto-filename',
                      '--user-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  ] + http_flags + ['-P', '-v', '--stats', '15s'] if fallback_remote else None
                  run_with_failover(cmd1, cmd2)
              else:
                  print('⚡ Descargando con acelerador Aria2c multi-conexión (16 hilos)...')
                  os.makedirs('/tmp/aria_downloads', exist_ok=True)
                  aria_cmd = [
                      'aria2c',
                      '--max-connection-per-server=16',
                      '--split=16',
                      '--min-split-size=1M',
                      '-d', '/tmp/aria_downloads',
                      source
                  ]
                  subprocess.run(aria_cmd, check=True)
                  print('📤 Subiendo con motor multi-chunk a tu nube...')
                  cmd1 = ['rclone', 'copy', '/tmp/aria_downloads', dest_remote] + turbo_flags + ['-P', '-v']
                  cmd2 = ['rclone', 'copy', '/tmp/aria_downloads', fallback_remote] + turbo_flags + ['-P', '-v'] if fallback_remote else None
                  run_with_failover(cmd1, cmd2)

          # CASO 6: Origen Remoto Genérico Rclone
          else:
              print(f'📦 Transferencia genérica desde: {source}')
              cmd1 = ['rclone', 'copy', source, dest_remote] + turbo_flags + ['-P', '-v']
              cmd2 = ['rclone', 'copy', source, fallback_remote] + turbo_flags + ['-P', '-v'] if fallback_remote else None
              run_with_failover(cmd1, cmd2)

          print('🎉 ¡Transferencia turbo completada al 100% exitosamente!')
          EOF

      - name: 📊 Auditoría Forense y Verificación Criptográfica de Integridad
        env:
          DEST_TARGET: ${{ inputs.destination_target }}
          DEST_FOLDER: ${{ inputs.dest_folder }}
        run: |
          echo "=========================================================="
          echo "📊 AUDITORÍA Y TAMAÑO TOTAL TRANSFERIDO A LA NUBE:"
          echo "=========================================================="
          if [[ "${{ inputs.destination_target }}" == *"Google Drive"* ]]; then
            rclone size "midrive:${{ inputs.dest_folder }}" --fast-list || rclone size "midrive2:${{ inputs.dest_folder }}" --fast-list || true
          elif [[ "${{ inputs.destination_target }}" == *"OneDrive"* ]]; then
            rclone size "onedrive:${{ inputs.dest_folder }}" --fast-list || true
          else
            rclone size "target_remote:${{ inputs.dest_folder }}" --fast-list || true
          fi
          echo "=========================================================="
          echo "✅ TRANSFERENCIA VERIFICADA Y CERTIFICADA AL 100%"
          echo "=========================================================="

      - name: 🔔 Notificación Push Inmediata a Telegram (Cero Intermediarios)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_URL: ${{ inputs.source_url }}
          DEST_TARGET: ${{ inputs.destination_target }}
          DEST_FOLDER: ${{ inputs.dest_folder }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          status = os.environ.get("JOB_STATUS")
          source = os.environ.get("SOURCE_URL", "")
          target = os.environ.get("DEST_TARGET", "")
          folder = os.environ.get("DEST_FOLDER", "")

          if not token or not chat_id:
              print("ℹ️ Telegram credentials not configured. Skipping.")
              exit(0)

          if status == "success":
              icon = "🎉"
              title = "¡TRANSFERENCIA COMPLETADA AL 100%!"
          else:
              icon = "❌"
              title = "LA TRANSFERENCIA FALLÓ O FUE CANCELADA"

          html_msg = (
              f"{icon} <b>{title}</b>\n\n"
              f"📦 <b>Origen:</b> <code>{source}</code>\n"
              f"☁️ <b>Destino:</b> {target}\n"
              f"📁 <b>Carpeta:</b> <code>{folder}</code>\n"
              f"⏱️ <b>Servidor:</b> Microsoft Azure Cloud (PC Apagada)"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": html_msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  if resp.status == 200:
                      print("✅ Notificación push enviada a Telegram con éxito.")
          except Exception as e:
              print(f"⚠️ Error al enviar Telegram: {e}")
          EOF
