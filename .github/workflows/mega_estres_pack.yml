name: 🌪️ Banco de Pruebas de Estrés Extremo (Lotes 30GB - 100GB)

on:
  workflow_dispatch:
    inputs:
      pack_selection:
        description: '📦 Selecciona el lote de prueba a ejecutar'
        required: true
        default: 'Lote 1 (30.5 GB: AlmaLinux 9 DVD + Rocky Linux 9 DVD + BitTorrent Sintel)'
        type: choice
        options:
          - 'Lote 1 (30.5 GB: AlmaLinux 9 DVD + Rocky Linux 9 DVD + BitTorrent Sintel)'
          - 'Lote 2 (30.5 GB: Ubuntu 24.04 + Kali + Debian + OpenSUSE)'
          - 'Mega Pack 100 GB Secuencial (Lotes 1, 2 y 3 continuos)'
      purge_after_test:
        description: '🧹 ¿Purgar carpeta de prueba tras verificar en Google Drive? (true = conserva tu espacio libre)'
        required: true
        default: true
        type: boolean
      destination_folder:
        description: '📁 Carpeta de destino en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_estres_30gb'
        type: string

jobs:
  estres_extremo_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          echo "🚀 Algoritmo de congestión activo:"
          sysctl net.ipv4.tcp_congestion_control

      - name: 🧹 Purga de Disco Azure para Máximo Rendimiento (~65-70 GB Libres)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /imagegeneration || true
          sudo docker image prune -a -f || true
          df -h /

      - name: 🛠️ Instalar Dependencias de Alta Velocidad (Rclone, Aria2, Node/WebTorrent)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl python3 python3-pip
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g webtorrent-cli
          curl https://rclone.org/install.sh | sudo bash
          echo "✅ Herramientas listas:"
          rclone --version | head -n 2
          aria2c --version | head -n 1
          webtorrent --version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Pipeline Secuencial de Estrés (Cero Desbordamiento)
        env:
          PACK_SEL: ${{ inputs.pack_selection }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request

          pack_sel = os.environ.get('PACK_SEL', '')
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_estres_30gb').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          dest_remote = f'midrive:{folder}'
          print(f"🎯 Destino en Google Drive: {dest_remote}")
          print(f"📦 Paquete Seleccionado: {pack_sel}")

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Error enviando Telegram: {e}")

          # Manifiesto real con ISOs oficiales de CDN ultra-rápidos
          manifest_lote_1 = [
              {
                  "name": "Sintel P2P BitTorrent HD Pack (Video + Subs + Art)",
                  "type": "torrent",
                  "source": "https://webtorrent.io/torrents/sintel.torrent",
                  "est_size_mb": 129
              },
              {
                  "name": "AlmaLinux 9 DVD ISO (Distribución Enterprise)",
                  "type": "aria2",
                  "source": "https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso",
                  "filename": "AlmaLinux-9-latest-x86_64-dvd.iso",
                  "est_size_mb": 15152
              },
              {
                  "name": "Rocky Linux 9 DVD ISO (Distribución Enterprise)",
                  "type": "aria2",
                  "source": "https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso",
                  "filename": "Rocky-9-latest-x86_64-dvd.iso",
                  "est_size_mb": 15194
              }
          ]

          manifest_lote_2 = [
              {
                  "name": "Ubuntu Desktop 24.04.4 LTS ISO",
                  "type": "aria2",
                  "source": "https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso",
                  "filename": "ubuntu-24.04.4-desktop-amd64.iso",
                  "est_size_mb": 6655
              }
          ]

          items_to_process = []
          if "Lote 1" in pack_sel:
              items_to_process = manifest_lote_1
          elif "Lote 2" in pack_sel:
              items_to_process = manifest_lote_2
          else:
              items_to_process = manifest_lote_1 + manifest_lote_2

          total_est_mb = sum(x["est_size_mb"] for x in items_to_process)
          print(f"📊 Total de items a procesar: {len(items_to_process)} ({total_est_mb / 1024:.2f} GB)")

          notify_tg(
              f"🚀 <b>INICIANDO BANCO DE PRUEBAS DE ESTRÉS REAL ({total_est_mb / 1024:.2f} GB)</b>\n\n"
              f"📦 <b>Lote:</b> <code>{pack_sel}</code>\n"
              f"☁️ <b>Destino:</b> <code>{dest_remote}</code>\n"
              f"⚡ <b>Tecnología:</b> Google BBR + Chunks 128MB + Pipeline Secuencial\n"
              f"⏱️ <b>Servidor:</b> Azure Cloud (PC Apagada)"
          )

          work_dir = "/tmp/estres_workdir"
          os.makedirs(work_dir, exist_ok=True)

          rclone_turbo_flags = [
              '--fast-list',
              '--transfers=8',
              '--checkers=16',
              '--buffer-size=64M',
              '--use-mmap',
              '--drive-chunk-size=128M',
              '--drive-pacer-min-sleep=10ms',
              '--drive-pacer-burst=200',
              '--retries=5',
              '--low-level-retries=10'
          ]

          total_bytes_transferred = 0
          start_total_time = time.time()

          for idx, item in enumerate(items_to_process, 1):
              print("\n" + "="*70)
              print(f"🔄 [{idx}/{len(items_to_process)}] PROCESANDO: {item['name']}")
              print("="*70)

              item_dir = os.path.join(work_dir, f"item_{idx}")
              os.makedirs(item_dir, exist_ok=True)
              t0 = time.time()

              # 1. DESCARGA
              if item["type"] == "torrent":
                  print(f"🧲 Descargando Torrent P2P: {item['source']}...")
                  subprocess.run(['webtorrent', 'download', item['source'], '-o', item_dir], check=True)
              else:
                  print(f"⚡ Descargando vía Aria2c (16 hilos): {item['source']}...")
                  target_file = os.path.join(item_dir, item["filename"])
                  subprocess.run([
                      'aria2c',
                      '--max-connection-per-server=16',
                      '--split=16',
                      '--min-split-size=4M',
                      '-d', item_dir,
                      '-o', item["filename"],
                      item['source']
                  ], check=True)

              dl_time = time.time() - t0
              item_size_bytes = sum(os.path.getsize(os.path.join(r, f)) for r, d, fs in os.walk(item_dir) for f in fs)
              total_bytes_transferred += item_size_bytes
              dl_speed_mb = (item_size_bytes / (1024*1024)) / max(dl_time, 0.001)

              print(f"✅ Descarga completada: {item_size_bytes / (1024*1024):.2f} MB en {dl_time:.1f}s ({dl_speed_mb:.2f} MB/s)")

              # 2. SUBIDA A GOOGLE DRIVE
              t_up = time.time()
              print(f"📤 Subiendo a Google Drive ({dest_remote})...")
              subprocess.run(['rclone', 'copy', item_dir, dest_remote] + rclone_turbo_flags + ['-P', '--stats', '10s'], check=True)
              up_time = time.time() - t_up
              up_speed_mb = (item_size_bytes / (1024*1024)) / max(up_time, 0.001)

              print(f"🎉 Subida completada: en {up_time:.1f}s ({up_speed_mb:.2f} MB/s)")

              # 3. LIBERACIÓN INMEDIATA DE DISCO (Pipeline Anti-Desbordamiento)
              shutil.rmtree(item_dir)
              print(f"🧹 Disco de Azure liberado inmediatamente. Uso actual:")
              subprocess.run(['df', '-h', '/'])

              notify_tg(
                  f"✅ <b>Ítem {idx}/{len(items_to_process)} Completado</b>\n"
                  f"📁 <code>{item['name']}</code>\n"
                  f"📊 <b>Tamaño:</b> {item_size_bytes / (1024*1024*1024):.2f} GB\n"
                  f"⬇️ <b>Descarga:</b> {dl_speed_mb:.1f} MB/s | ⬆️ <b>Subida:</b> {up_speed_mb:.1f} MB/s"
              )

          total_elapsed = time.time() - start_total_time
          total_gb = total_bytes_transferred / (1024*1024*1024)
          avg_speed_mb = (total_bytes_transferred / (1024*1024)) / max(total_elapsed, 0.001)

          print("\n" + "#"*70)
          print(f"🏆 AUDITORÍA FINAL DE LA PRUEBA EN GOOGLE DRIVE:")
          print(f"📦 Total Transferido: {total_gb:.2f} GB ({total_bytes_transferred:,} Bytes)")
          print(f"⏱️ Tiempo Total: {total_elapsed / 60:.2f} minutos ({avg_speed_mb:.2f} MB/s promedio global)")
          print("#"*70)

          # Verificación directa en Google Drive
          subprocess.run(['rclone', 'size', dest_remote])
          subprocess.run(['rclone', 'lsl', dest_remote])

          if purge:
              print(f"🧹 Purgando carpeta de prueba {dest_remote} para no ocupar tus 4.25 TB libres...")
              subprocess.run(['rclone', 'purge', dest_remote])
              print("✅ Limpieza completada con éxito.")

          notify_tg(
              f"🎉 <b>¡BANCO DE PRUEBAS DE ESTRÉS COMPLETADO AL 100%!</b>\n\n"
              f"📊 <b>Volumen Real Transferido:</b> {total_gb:.2f} GB ({total_bytes_transferred:,} Bytes)\n"
              f"⏱️ <b>Tiempo Total:</b> {total_elapsed / 60:.2f} min\n"
              f"⚡ <b>Velocidad Sostenida Nube:</b> {avg_speed_mb:.1f} MB/s\n"
              f"📁 <b>Destino:</b> Google Drive (Julio)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Ejecutada (Tu Drive limpio)' if purge else 'Archivos conservados'}\n"
              f"⏱️ <b>Servidor:</b> Microsoft Azure Cloud (PC Apagada)"
          )
          EOF
