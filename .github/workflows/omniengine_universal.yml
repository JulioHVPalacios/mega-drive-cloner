          import os, time, subprocess, shutil, json, sys, threading, urllib.request

          nodo_id = os.environ.get('NODO_ID', '1').strip()
          dest_acc_input = os.environ.get('DEST_ACC_INPUT', 'both').strip()
          default_acc = os.environ.get('DEFAULT_ACCOUNT', 'midrive').strip()
          if dest_acc_input == 'midrive':
              target_account = 'midrive'
          elif dest_acc_input == 'midrive2':
              target_account = 'midrive2'
          else:
              target_account = default_acc
          account_label = os.environ.get('ACCOUNT_LABEL', '').strip()
          url = os.environ.get('SOURCE_URL', '').strip()
          filename = os.environ.get('FILE_NAME', 'stream_file.iso').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_stream_30gb').strip()
          dest_remote = f"{target_account}:{folder}"
          dest_file_path = f"{dest_remote}/{filename}"
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          MAX_TIMEOUT_SECONDS = 230  # 3m 50s estrictos (< 4 min)

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url_api = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url_api, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          notify_tg(f"💿 <b>[STREAM NODO {nodo_id}] INICIADO</b>\nArchivo: <code>{filename}</code>\nDestino: <code>{dest_file_path}</code>")

          start_total = time.time()
          stop_watchdog = threading.Event()
          p_curl = None
          p_rclone = None

          def watchdog():
              while not stop_watchdog.wait(5.0):
                  if time.time() - start_total >= MAX_TIMEOUT_SECONDS:
                      notify_tg(f"🚨 [CORTE STREAM NODO {nodo_id}] Superó 3m 50s. Abortando...")
                      for p in [p_curl, p_rclone]:
                          if p and p.poll() is None:
                              try:
                                  p.kill()
                              except:
                                  pass
                      subprocess.run(['rclone', 'deletefile', dest_file_path])
                      sys.exit(1)

          wd_thread = threading.Thread(target=watchdog, daemon=True)
          wd_thread.start()

          fifo_path = f"/tmp/stream_fifo_{nodo_id}"
          if os.path.exists(fifo_path):
              os.remove(fifo_path)
          os.mkfifo(fifo_path)

          try:
              curl_cmd = ['curl', '-fSL', '--retry', '3', url, '-o', fifo_path]
              rclone_cmd = [
                  'rclone', 'rcat', dest_file_path,
                  '--drive-chunk-size=128M',
                  '--drive-upload-cutoff=128M',
                  '--buffer-size=64M',
                  '-v', '--stats=5s'
              ]
              fifo_read = open(fifo_path, 'rb')
              p_rclone = subprocess.Popen(rclone_cmd, stdin=fifo_read)
              p_curl = subprocess.Popen(curl_cmd)

              p_curl.wait()
              fifo_read.close()
              p_rclone.wait()

              if p_curl.returncode != 0 or p_rclone.returncode != 0:
                  notify_tg(f"❌ Error en stream nodo {nodo_id}")
                  sys.exit(1)

              elapsed = time.time() - start_total
              notify_tg(f"⚡ <b>[STREAM NODO {nodo_id} - COMPLETADO]</b> en {elapsed:.1f}s")
          finally:
              stop_watchdog.set()
              if os.path.exists(fifo_path):
                  os.remove(fifo_path)
          EOF

  # Auditoría Stream Monolítico
  audit_monolithic:
    name: '🔍 Auditoría Stream Monolítico'
    needs: monolithic_stream
    if: always() && inputs.engine_mode == 'monolithic_stream'
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Instalar Rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 📊 Inspeccionar y Purgar Stream
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_stream_30gb').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          accs = ['midrive', 'midrive2']
          total_bytes = 0
          for acc in accs:
              p = f"{acc}:{folder}"
              res = subprocess.run(['rclone', 'size', p, '--json'], capture_output=True, text=True)
              if res.returncode == 0:
                  try:
                      d = json.loads(res.stdout)
                      total_bytes += d.get('bytes', 0)
                  except:
                      pass
              if purge:
                  subprocess.run(['rclone', 'purge', p])

          total_gb = total_bytes / (1024**3)
          notify_tg(f"🏁 <b>[STREAM AUDITORÍA]</b>\nTotal Transferido: {total_gb:.2f} GB ({total_bytes:,} B)\nTiempo Clúster: (Menos de 4 Minutos)\nPurga: {'Realizada' if purge else 'Omitida'}")
          EOF

