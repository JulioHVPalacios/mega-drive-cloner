          import os, time, subprocess, shutil, json, sys, threading, urllib.request

          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()
          target_account = os.environ.get('TARGET_ACCOUNT', 'midrive').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_archive_cloud_extract').strip()
          pwd = os.environ.get('PASS', '').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          dest_remote = f"{target_account}:{folder}"

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          notify_tg(f"🗜️ <b>[EXTRACCIÓN EN NUBE] INICIADA</b>\nDestino: <code>{dest_remote}</code>")

          t0 = time.time()
          work_dir = "/tmp/extract_work"
          shutil.rmtree(work_dir, ignore_errors=True)
          os.makedirs(work_dir, exist_ok=True)

          # Simular/descargar paquete comprimido para prueba
          test_archive = "/tmp/test_pack.7z"
          print("Generando contenedor de prueba...")
          sample_dir = "/tmp/sample_data"
          os.makedirs(sample_dir, exist_ok=True)
          with open(os.path.join(sample_dir, "test1.dat"), "wb") as f:
              f.write(b"0" * (100 * 1024 * 1024))
          with open(os.path.join(sample_dir, "test2.dat"), "wb") as f:
              f.write(b"1" * (100 * 1024 * 1024))

          subprocess.run(['7z', 'a', test_archive, f"{sample_dir}/*", '-mx1'])

          # Descomprimir
          out_dir = "/tmp/extracted_output"
          os.makedirs(out_dir, exist_ok=True)
          cmd_extract = ['7z', 'x', test_archive, f"-o{out_dir}", '-y']
          if pwd:
              cmd_extract.append(f"-p{pwd}")
          subprocess.run(cmd_extract)

          # Subida a Drive
          subprocess.run(['rclone', 'copy', out_dir, dest_remote, '--transfers=4', '--drive-chunk-size=128M'])

          if purge:
              subprocess.run(['rclone', 'purge', dest_remote])

          elapsed = time.time() - t0
          notify_tg(f"🏁 <b>[EXTRACCIÓN EN NUBE] COMPLETADA</b> en {elapsed:.1f}s")
          EOF

