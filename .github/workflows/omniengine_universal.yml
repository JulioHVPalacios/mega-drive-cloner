name: '⚡ OmniEngine Universal: Ingesta Inteligente a Google Drive'

on:
  workflow_dispatch:
    inputs:
      engine_mode:
        description: 'Selecciona el Modo de Ingesta (Benchmark 30 GB)'
        required: true
        default: 'archive_cloud_extract'
        type: choice
        options:
          - 'archive_cloud_extract'
          - 'monolithic_stream'
          - 'megapack_swarm'
      destination_account:
        description: 'Cuenta de Google Drive destino'
        required: true
        default: 'midrive'
        type: choice
        options:
          - 'midrive'
          - 'midrive2'
      destination_folder:
        description: 'Carpeta de prueba en Google Drive'
        required: true
        default: 'DESCARGAS_UNIVERSALES/test_omniengine_30gb'
      purge_after_test:
        description: 'Purgar después de auditar (dejar espacio 100% limpio)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # MODO 1: MEGAPACK_SWARM (4 Nodos en Paralelo para Colecciones Masivas)
  # =========================================================================
  megapack_swarm:
    name: '🚀 Nodo ${{ matrix.nodo }} - ${{ matrix.name }}'
    if: inputs.engine_mode == 'megapack_swarm'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nodo: 1
            account: 'midrive'
            account_label: 'Julio Palacios (5TB - midrive)'
            name: 'AlmaLinux 9 Min (2.8GB) + openSUSE Leap (4.6GB) ➔ Julio'
            urls: 'https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso https://mirror.uepg.br/opensuse/distribution/leap/15.6/iso/openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso'
          - nodo: 2
            account: 'midrive'
            account_label: 'Julio Palacios (5TB - midrive)'
            name: 'Ubuntu 24.04 (6.2GB) + Arch Linux (1.1GB) ➔ Julio'
            urls: 'https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso'
          - nodo: 3
            account: 'midrive2'
            account_label: 'Vexor (2TB - midrive2)'
            name: 'Rocky Linux 9 Min (2.8GB) + Ubuntu 22.04 (4.8GB) ➔ Vexor'
            urls: 'https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-minimal.iso https://releases.ubuntu.com/22.04/ubuntu-22.04.5-desktop-amd64.iso'
          - nodo: 4
            account: 'midrive2'
            account_label: 'Vexor (2TB - midrive2)'
            name: 'Debian 13 (3.7GB) + Ubuntu Server (3.2GB) + CentOS (1.6GB) ➔ Vexor'
            urls: 'https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/debian-13.6.0-amd64-DVD-1.iso https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/iso/CentOS-Stream-9-latest-x86_64-boot.iso'
      fail-fast: false
    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864"
          sudo sysctl -w net.ipv4.tcp_window_scaling=1

      - name: 🧹 Limpieza Profunda de Disco Azure (~72 GB Libres)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker system prune -af --volumes || true
          df -h

      - name: ⚡ Acelerador de Arranque (Instalación Binaria Directa)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends aria2
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🌪️ Ejecutar Transferencia Apex Swarm con Telemetría Telegram en Vivo
        env:
          NODO_ID: ${{ matrix.nodo }}
          TARGET_ACCOUNT: ${{ matrix.account }}
          ACCOUNT_LABEL: ${{ matrix.account_label }}
          SOURCE_URLS: ${{ matrix.urls }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request, threading

          nodo_id = os.environ.get('NODO_ID', '1').strip()
          target_account = os.environ.get('TARGET_ACCOUNT', 'midrive').strip()
          account_label = os.environ.get('ACCOUNT_LABEL', '').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_omniengine_30gb').strip()
          dest_remote = f"{target_account}:{folder}/nodo_{nodo_id}"
          urls_raw = os.environ.get('SOURCE_URLS', '').strip()
          source_urls = [u.strip() for u in urls_raw.split() if u.strip()]
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          notify_tg(f"🚀 <b>[NODO {nodo_id}/4 - SWARM] INICIADO</b>\nCarga: {len(source_urls)} archivos\nDestino: <code>{dest_remote}</code> ({account_label})")

          work_dir = f"/tmp/nodo_{nodo_id}_workdir"
          shutil.rmtree(work_dir, ignore_errors=True)
          os.makedirs(work_dir, exist_ok=True)

          input_file = f"/tmp/urls_nodo{nodo_id}.txt"
          with open(input_file, 'w') as f:
              for u in source_urls:
                  f.write(f"{u}\n")

          start_total = time.time()
          t_dl_start = time.time()
          aria2_cmd = [
              'aria2c',
              '-i', input_file,
              '-j', str(len(source_urls)),
              '--max-connection-per-server=16',
              '--split=16',
              '--min-split-size=5M',
              '--file-allocation=none',
              '--disk-cache=128M',
              '--summary-interval=10',
              '--follow-torrent=false',
              '-d', work_dir
          ]
          subprocess.run(aria2_cmd, check=True)
          dl_time = time.time() - t_dl_start

          files = [f for f in os.listdir(work_dir) if os.path.isfile(os.path.join(work_dir, f))]
          total_bytes = sum(os.path.getsize(os.path.join(work_dir, f)) for f in files)
          total_mb = total_bytes / (1024 * 1024)
          total_gb = total_bytes / (1024 * 1024 * 1024)
          dl_speed = total_mb / max(dl_time, 0.001)

          notify_tg(f"⬇️ <b>[NODO {nodo_id}/4] DESCARGA COMPLETADA</b>\nArchivos: {len(files)} ({total_gb:.2f} GB)\nTiempo: {dl_time:.1f}s ({dl_speed:.1f} MB/s)\nIniciando subida a Drive...")

          # Subida a Google Drive con monitor de progreso
          t_up_start = time.time()
          rclone_cmd = [
              'rclone', 'copy',
              work_dir, dest_remote,
              '--drive-chunk-size=256M',
              '--drive-upload-cutoff=256M',
              '--transfers=4',
              '--checkers=8',
              '--drive-pacer-min-sleep=10ms',
              '--drive-pacer-burst=200',
              '--buffer-size=64M',
              '--use-mmap',
              '--no-traverse',
              '--stats=10s',
              '--stats-one-line',
              '--retries=5',
              '--low-level-retries=10'
          ]
          subprocess.run(rclone_cmd, check=True)
          up_time = time.time() - t_up_start
          up_speed = total_mb / max(up_time, 0.001)

          shutil.rmtree(work_dir, ignore_errors=True)
          if os.path.exists(input_file):
              os.remove(input_file)

          elapsed_node = time.time() - start_total
          avg_speed = total_mb / max(elapsed_node, 0.001)

          notify_tg(
              f"✅ <b>[NODO {nodo_id}/4 - SWARM] FINALIZADO</b>\n\n"
              f"📦 <b>Volumen:</b> {total_gb:.2f} GB ({len(files)} archivos)\n"
              f"⏱️ <b>Tiempo de Nodo:</b> {elapsed_node / 60:.2f} min ({elapsed_node:.1f}s)\n"
              f"⬇️ <b>Descarga:</b> {dl_speed:.1f} MB/s ({dl_time:.1f}s)\n"
              f"⬆️ <b>Subida Neta:</b> {up_speed:.1f} MB/s ({up_time:.1f}s)\n"
              f"🚀 <b>Velocidad E2E:</b> {avg_speed:.1f} MB/s"
          )
          EOF

  # Auditoría Consolidada Swarm
  audit_swarm:
    needs: megapack_swarm
    if: inputs.engine_mode == 'megapack_swarm'
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Acelerador de Arranque Rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🏆 Auditoría Forense y Purga Consolidada
        env:
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, subprocess, json, urllib.request

          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_omniengine_30gb').strip()
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          targets = [
              ('Julio (midrive - Nodo 1)', f'midrive:{folder}/nodo_1'),
              ('Julio (midrive - Nodo 2)', f'midrive:{folder}/nodo_2'),
              ('Vexor (midrive2 - Nodo 3)', f'midrive2:{folder}/nodo_3'),
              ('Vexor (midrive2 - Nodo 4)', f'midrive2:{folder}/nodo_4')
          ]
          remotes_to_clean = ['midrive', 'midrive2']

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          total_bytes = 0
          total_count = 0
          breakdown_lines = []

          for label, target in targets:
              res = subprocess.run(['rclone', 'size', target, '--json'], stdout=subprocess.PIPE, text=True)
              subprocess.run(['rclone', 'lsl', target])
              sub_bytes = 0
              sub_count = 0
              try:
                  d = json.loads(res.stdout)
                  sub_bytes = d.get('bytes', 0)
                  sub_count = d.get('count', 0)
              except:
                  pass
              total_bytes += sub_bytes
              total_count += sub_count
              breakdown_lines.append(f"• <b>{label}:</b> {sub_bytes / (1024*1024*1024):.2f} GB ({sub_count} archivos)")

          total_gb = total_bytes / (1024*1024*1024)

          if purge:
              for _, target in targets:
                  subprocess.run(['rclone', 'purge', target])
              for r in remotes_to_clean:
                  subprocess.run(['rclone', 'rmdirs', f'{r}:DESCARGAS_UNIVERSALES'])

          breakdown_str = "\n".join(breakdown_lines)
          notify_tg(
              f"🏆 <b>¡CLÚSTER MEGAPACK SWARM FINALIZADO!</b>\n\n"
              f"📦 <b>Volumen Total Auditado:</b> {total_gb:.2f} GB ({total_count} objetos)\n\n"
              f"📊 <b>Desglose por Servidor:</b>\n{breakdown_str}\n\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Completada (0 B ocupados en tus drives)' if purge else 'Conservada'}"
          )
          EOF

  # =========================================================================
  # MODO 2: MONOLITHIC_STREAM (Streaming Directo por RAM para ISOs Gigantes)
  # =========================================================================
  monolithic_stream:
    name: '💿 Streaming Directo por RAM (0 Bytes en Disco Azure)'
    if: inputs.engine_mode == 'monolithic_stream'
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864"
          sudo sysctl -w net.ipv4.tcp_window_scaling=1

      - name: ⚡ Acelerador de Arranque Rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: '🌊 Ejecutar Cut-Through RAM Streaming (Dos ISOs Gigantes - 30.34 GB)'
        env:
          DEST_ACCOUNT: ${{ inputs.destination_account }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, json, urllib.request, threading

          dest_account = os.environ.get('DEST_ACCOUNT', 'midrive').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_omniengine_30gb').strip()
          dest_remote = f"{dest_account}:{folder}/stream_iso"
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          # ISOs gigantes para prueba de streaming sin disco (~30.34 GB)
          stream_targets = [
              ("AlmaLinux 9 DVD (15.15 GB)", "https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-dvd.iso", "AlmaLinux-9-DVD.iso"),
              ("Rocky Linux 9 DVD (15.19 GB)", "https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso", "Rocky-9-DVD.iso")
          ]

          notify_tg(
              f"🌊 <b>[MONOLITHIC STREAM] INICIADO</b>\n"
              f"Tecnología: Cut-Through RAM Streaming (0 Bytes en disco de Azure)\n"
              f"Carga: 2 ISOs masivas (~30.34 GB totales)\n"
              f"Destino: <code>{dest_remote}</code>"
          )

          total_stream_bytes = 0
          t_global_start = time.time()

          for label, url, out_filename in stream_targets:
              target_file_remote = f"{dest_remote}/{out_filename}"
              notify_tg(f"▶️ <b>Transmitiendo vía RAM:</b> {label}\nEnlace -> Búfer 256MB -> Google Drive...")
              
              t0 = time.time()
              # Stream directo con curl pipe rclone rcat
              curl_cmd = f"curl -sL '{url}' | rclone rcat '{target_file_remote}' --drive-chunk-size=256M --buffer-size=256M --stats=15s --stats-one-line"
              subprocess.run(curl_cmd, shell=True, check=True)
              t_file = time.time() - t0
              
              # Medir archivo en Drive
              res_sz = subprocess.run(['rclone', 'size', target_file_remote, '--json'], stdout=subprocess.PIPE, text=True)
              f_bytes = 0
              try:
                  f_bytes = json.loads(res_sz.stdout).get('bytes', 0)
              except:
                  pass
              total_stream_bytes += f_bytes
              f_mb = f_bytes / (1024*1024)
              f_gb = f_bytes / (1024*1024*1024)
              f_speed = f_mb / max(t_file, 0.001)

              notify_tg(f"✅ <b>Completado:</b> {label}\n📦 Tamaño: {f_gb:.2f} GB\n⏱️ Tiempo: {t_file/60:.2f} min ({t_file:.1f}s)\n⚡ Velocidad: {f_speed:.1f} MB/s")

          t_total = time.time() - t_global_start
          tot_mb = total_stream_bytes / (1024*1024)
          tot_gb = total_stream_bytes / (1024*1024*1024)
          tot_speed = tot_mb / max(t_total, 0.001)

          notify_tg(f"🔍 <b>Iniciando Auditoría Forense en Google Drive...</b>")
          res_audit = subprocess.run(['rclone', 'size', dest_remote, '--json'], stdout=subprocess.PIPE, text=True)
          subprocess.run(['rclone', 'lsl', dest_remote])

          if purge:
              subprocess.run(['rclone', 'purge', dest_remote])
              subprocess.run(['rclone', 'rmdirs', f'{dest_account}:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡PRUEBA MONOLITHIC STREAM FINALIZADA!</b>\n\n"
              f"📦 <b>Volumen Transferido:</b> {tot_gb:.2f} GB (2 ISOs íntegras sin particionar)\n"
              f"⏱️ <b>Tiempo Total:</b> {t_total / 60:.2f} min ({t_total:.1f}s)\n"
              f"🚀 <b>Velocidad Promedio:</b> {tot_speed:.1f} MB/s\n"
              f"💾 <b>Disco Azure Consumido:</b> 0 Bytes (100% RAM Streaming)\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Completada (0 B libres)' if purge else 'Conservada'}"
          )
          EOF

  # =========================================================================
  # MODO 3: ARCHIVE_CLOUD_EXTRACT (Descompresión Automática en la Nube)
  # =========================================================================
  archive_cloud_extract:
    name: '🗜️ Auto-Extracción en Nube (Archivos Comprimidos ➔ Contenido Desglosado)'
    if: inputs.engine_mode == 'archive_cloud_extract'
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Optimización Nuclear de Red (Google BBR + Ventana TCP 64MB)
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864"
          sudo sysctl -w net.ipv4.tcp_window_scaling=1

      - name: 🧹 Limpieza Profunda de Disco Azure (~72 GB Libres)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/lib/jvm
          sudo docker system prune -af --volumes || true
          df -h

      - name: ⚡ Acelerador de Arranque (Aria2c + P7zip + Rclone)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends aria2 p7zip-full
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          rm -f /tmp/rclone.zip
          rclone version

      - name: 🔐 Inyectar Credenciales de Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: 🌪️ Descarga, Empaquetado, Auto-Extracción y Subida con Heartbeat Telegram
        env:
          DEST_ACCOUNT: ${{ inputs.destination_account }}
          DEST_FOLDER: ${{ inputs.destination_folder }}
          PURGE_AFTER: ${{ inputs.purge_after_test }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, time, subprocess, shutil, json, urllib.request, threading

          dest_account = os.environ.get('DEST_ACCOUNT', 'midrive').strip()
          folder = os.environ.get('DEST_FOLDER', 'DESCARGAS_UNIVERSALES/test_omniengine_30gb').strip()
          dest_remote = f"{dest_account}:{folder}/extracted_content"
          purge = os.environ.get('PURGE_AFTER', 'true').lower() == 'true'
          tg_token = os.environ.get('TG_TOKEN', '').strip()
          tg_chat_id = os.environ.get('TG_CHAT_ID', '').strip()

          def notify_tg(text):
              if not tg_token or not tg_chat_id:
                  return
              try:
                  url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
                  data = json.dumps({"chat_id": tg_chat_id, "text": text, "parse_mode": "HTML"}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print(f"⚠️ Telegram err: {e}")

          notify_tg(
              f"🗜️ <b>[ARCHIVE CLOUD EXTRACT] INICIADO</b>\n"
              f"Objetivo: Descomprimir paquete multimedia de ~30.5 GB en la nube y subir archivos desglosados listos para reproducir\n"
              f"Destino: <code>{dest_remote}</code>"
          )

          start_total = time.time()
          work_dir = "/tmp/paquete_raw"
          extract_dir = "/tmp/contenido_extraido_listo"
          shutil.rmtree(work_dir, ignore_errors=True)
          shutil.rmtree(extract_dir, ignore_errors=True)
          os.makedirs(f"{work_dir}/videos", exist_ok=True)
          os.makedirs(f"{work_dir}/software", exist_ok=True)
          os.makedirs(f"{work_dir}/textos", exist_ok=True)
          os.makedirs(f"{work_dir}/isos", exist_ok=True)

          # Manifiesto de descarga con Aria2c (100% URLs directas y ultra-rápidas, sin torrents p2p)
          download_items = [
              ("https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso", f"{work_dir}/isos/ubuntu-24.04-desktop.iso"),
              ("https://mirror.uepg.br/opensuse/distribution/leap/15.6/iso/openSUSE-Leap-15.6-DVD-x86_64-Build710.3-Media.iso", f"{work_dir}/isos/openSUSE-15.6-DVD.iso"),
              ("https://releases.ubuntu.com/22.04/ubuntu-22.04.5-desktop-amd64.iso", f"{work_dir}/isos/ubuntu-22.04-desktop.iso"),
              ("https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/debian-13.6.0-amd64-DVD-1.iso", f"{work_dir}/isos/debian-13-DVD.iso"),
              ("https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso", f"{work_dir}/isos/ubuntu-server.iso"),
              ("https://download.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-minimal.iso", f"{work_dir}/isos/rocky-9-minimal.iso"),
              ("https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso", f"{work_dir}/isos/almalinux-9-minimal.iso"),
              ("https://download.blender.org/demo/movies/Blender_reel_2013.mov", f"{work_dir}/videos/Blender_4K_Reel.mov"),
              ("https://vscode.download.prss.microsoft.com/dbazure/download/stable/a44adf7f53e00964ab890f9f8758a334f1fc15bc/code_1.136.1-1788413865_amd64.deb", f"{work_dir}/software/vscode_amd64.deb"),
              ("https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz", f"{work_dir}/textos/linux-6.12-kernel-source.tar.xz")
          ]

          batch_file = "/tmp/aria2_extract_batch.txt"
          with open(batch_file, 'w') as f:
              for url, outpath in download_items:
                  d = os.path.dirname(outpath)
                  b = os.path.basename(outpath)
                  f.write(f"{url}\n  dir={d}\n  out={b}\n")

          notify_tg(f"⚡ <b>[PASO 1/4] Descargando 10 recursos heterogéneos (~30.5 GB)...</b>\nVideos 4K + Softwares + Kernel + ISOs")
          t_dl_start = time.time()
          aria2_cmd = [
              'aria2c',
              '-i', batch_file,
              '-j', '8',
              '--max-connection-per-server=16',
              '--split=16',
              '--min-split-size=5M',
              '--file-allocation=none',
              '--disk-cache=128M',
              '--follow-torrent=false',
              '--summary-interval=10'
          ]
          subprocess.run(aria2_cmd, check=True)
          dl_time = time.time() - t_dl_start

          raw_bytes = sum(os.path.getsize(os.path.join(root, f)) for root, _, fl in os.walk(work_dir) for f in fl)
          raw_gb = raw_bytes / (1024*1024*1024)
          dl_speed = (raw_bytes / (1024*1024)) / max(dl_time, 0.001)

          notify_tg(f"✅ <b>[PASO 1/4] Descarga Completada:</b> {raw_gb:.2f} GB en {dl_time:.1f}s ({dl_speed:.1f} MB/s)\n📦 <b>[PASO 2/4] Creando contenedor comprimido .tar...</b>")

          # 2. Empaquetado comprimido
          archive_file = "/tmp/PAQUETE_MAESTRO_30GB.tar"
          t_pack_start = time.time()
          subprocess.run(["tar", "-cf", archive_file, "--remove-files", "-C", work_dir, "."], check=True)
          pack_time = time.time() - t_pack_start
          archive_bytes = os.path.getsize(archive_file)
          archive_gb = archive_bytes / (1024*1024*1024)
          shutil.rmtree(work_dir, ignore_errors=True)

          notify_tg(f"🗜️ <b>[PASO 3/4] Auto-Extracción en Nube Iniciada...</b>\nSimulando descompresión de paquete entrante de {archive_gb:.2f} GB")

          # 3. Extracción en la nube
          t_ext_start = time.time()
          os.makedirs(extract_dir, exist_ok=True)
          subprocess.run(["tar", "-xf", archive_file, "-C", extract_dir], check=True)
          ext_time = time.time() - t_ext_start
          
          # Eliminar el archivo .tar para liberar disco
          if os.path.exists(archive_file):
              os.remove(archive_file)

          extracted_count = sum(len(fl) for _, _, fl in os.walk(extract_dir))
          extracted_bytes = sum(os.path.getsize(os.path.join(root, f)) for root, _, fl in os.walk(extract_dir) for f in fl)
          extracted_gb = extracted_bytes / (1024*1024*1024)

          notify_tg(
              f"✨ <b>[PASO 3/4] Extracción Completada:</b> {extracted_count} archivos ({extracted_gb:.2f} GB) en {ext_time:.1f}s\n"
              f"📤 <b>[PASO 4/4] Subiendo estructura desglosada a Google Drive...</b>\n"
              f"Rclone multihilo (transfers: 4, chunks: 256MB)"
          )

          # 4. Subida de archivos desglosados a Drive
          t_up_start = time.time()
          rclone_cmd = [
              'rclone', 'copy',
              extract_dir, dest_remote,
              '--drive-chunk-size=256M',
              '--drive-upload-cutoff=256M',
              '--transfers=4',
              '--checkers=8',
              '--drive-pacer-min-sleep=10ms',
              '--drive-pacer-burst=200',
              '--buffer-size=64M',
              '--use-mmap',
              '--no-traverse',
              '--stats=15s',
              '--stats-one-line',
              '--retries=5',
              '--low-level-retries=10'
          ]
          subprocess.run(rclone_cmd, check=True)
          up_time = time.time() - t_up_start
          up_speed = (extracted_bytes / (1024*1024)) / max(up_time, 0.001)

          shutil.rmtree(extract_dir, ignore_errors=True)
          if os.path.exists(batch_file):
              os.remove(batch_file)

          total_elapsed = time.time() - start_total
          avg_speed = (extracted_bytes / (1024*1024)) / max(total_elapsed, 0.001)

          notify_tg(f"🔍 <b>[PASO FINAL] Realizando Auditoría Forense en Google Drive...</b>")
          res_size = subprocess.run(['rclone', 'size', dest_remote, '--json'], stdout=subprocess.PIPE, text=True)
          subprocess.run(['rclone', 'lsl', dest_remote])

          audit_bytes = 0
          audit_count = 0
          try:
              s_data = json.loads(res_size.stdout)
              audit_bytes = s_data.get('bytes', 0)
              audit_count = s_data.get('count', 0)
          except:
              pass

          if purge:
              subprocess.run(['rclone', 'purge', dest_remote], check=True)
              subprocess.run(['rclone', 'rmdirs', f'{dest_account}:DESCARGAS_UNIVERSALES'])

          notify_tg(
              f"🏆 <b>¡PRUEBA ARCHIVE CLOUD EXTRACT EXITOSA!</b>\n\n"
              f"📦 <b>Archivos Listos en Drive:</b> {audit_count} objetos ({audit_bytes / (1024*1024*1024):.2f} GB)\n"
              f"⏱️ <b>Tiempo Total E2E:</b> {total_elapsed / 60:.2f} min ({total_elapsed:.1f}s)\n"
              f"⬇️ <b>Descarga Fuentes:</b> {dl_time:.1f}s ({dl_speed:.1f} MB/s)\n"
              f"🗜️ <b>Empaque + Extracción:</b> {pack_time + ext_time:.1f}s\n"
              f"⬆️ <b>Subida a Drive:</b> {up_time:.1f}s ({up_speed:.1f} MB/s)\n"
              f"🚀 <b>Velocidad Promedio E2E:</b> {avg_speed:.1f} MB/s\n"
              f"🛡️ <b>Purga Post-Auditoría:</b> {'Completada (0 B libres)' if purge else 'Conservada'}\n"
              f"🎉 <b>Resultado:</b> Tus archivos quedaron desglosados y listos sin tener que unir nada."
          )
          EOF
